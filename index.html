<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Keitan</title>
<meta name="description" content="Keitan: a notebook home for paper notes and AI. Write instantly, scan handwritten pages, sort into DROP, STOCK, MAKE and TODAY.">
<meta name="theme-color" content="#E7E7E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: launcher-style home. A widget card (date, score, pixel invaders for open tasks, spaced wordmark),
   a numbered row of symbol tiles, then the notepad with TODAY beside it and three list lanes below.
   Everything is sized to the visible area above the on-screen keyboard. */
:root {
  --paper: #E7E7E4;
  --sheet: #F6F6F3;
  --ink: #262625;
  --ink-2: #7A7A76;
  --rule: #D3D3CF;
  --dot: #D5D5D1;
  --red: #DE4336;
  --drop: #9A9A96;
  --stock: #3A3A38;
  --make: #DE4336;
  --scrim: rgba(30, 30, 28, 0.38);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.03), 0 10px 24px -18px rgba(0, 0, 0, 0.35);
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-body: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #8D8D88; --rule: #2C2C2A; --dot: #2F2F2D;
    --red: #FF5B4D; --drop: #7F7F7B; --stock: #D8D8D4; --make: #FF5B4D;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 24px -16px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #8D8D88; --rule: #2C2C2A; --dot: #2F2F2D;
  --red: #FF5B4D; --drop: #7F7F7B; --stock: #D8D8D4; --make: #FF5B4D;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 24px -16px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
svg { display: block; flex: none; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* fitted to the visible viewport (keyboard-aware) */
.fit {
  position: fixed; left: 0; right: 0;
  top: calc(var(--vvt, 0px) + env(safe-area-inset-top, 0px));
  height: calc(var(--vvh, 100vh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.kb .fit { height: calc(var(--vvh, 100vh) - env(safe-area-inset-top, 0px)); }
.app { display: flex; flex-direction: column; gap: 10px; max-width: 1240px; margin: 0 auto; padding: 10px 16px 12px; }

/* widget card */
.widget {
  flex: none; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 4px; position: relative;
}
.w-top { display: flex; align-items: center; gap: 16px; min-height: 30px; }
.w-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ghost {
  height: 30px; min-width: 30px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
}
.ghost svg { width: 16px; height: 16px; }
.search { display: flex; align-items: center; position: relative; }
.search svg { position: absolute; left: 8px; width: 14px; height: 14px; color: var(--ink-2); pointer-events: none; }
.search input {
  height: 30px; width: 190px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  padding: 0 8px 0 28px; font-family: var(--f-mono); font-size: 12px; outline: none;
}
.search input:focus { border-color: var(--ink-2); }
#btn-search { display: none; }

.field { position: relative; padding: 6px 0 16px; }
.inv-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; max-height: 76px; overflow: hidden; padding: 2px 8px; }
.inv { width: 22px; height: 16px; padding: 0; border: 0; background: none; color: var(--ink-2); }
.inv.red { color: var(--red); }
.inv svg { width: 100%; height: 100%; }
.inv .fb { opacity: 0; }
.inv .fa { animation: frameA 1.4s linear infinite; }
.inv .fb { animation: frameB 1.4s linear infinite; }
@keyframes frameA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes frameB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
.inv.hit { animation: hit 0.28s ease-out forwards; }
@keyframes hit { 0% { transform: scale(1); } 35% { transform: scale(1.6); color: var(--red); } 100% { transform: scale(0.2); opacity: 0; } }
.more { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); align-self: center; letter-spacing: 0.1em; }
.all-clear { text-align: center; padding: 8px 0 2px; }
.cannon { position: absolute; bottom: 0; left: 50%; width: 20px; height: 11px; transform: translateX(-50%); color: var(--ink); transition: left 0.16s ease; }
.laser { position: absolute; width: 2px; background: var(--red); transform: translateX(-50%) scaleY(0); transform-origin: bottom; animation: laser 0.16s ease-out forwards; }
@keyframes laser { to { transform: translateX(-50%) scaleY(1); } }
.wordmark {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  border: 0; border-top: 1px solid var(--rule); background: none; padding: 8px 4px 4px; cursor: text;
  font-family: var(--f-mono); font-weight: 300; font-size: clamp(20px, 4.2vw, 34px); line-height: 1; color: var(--ink-2);
}
.wordmark .arr { font-size: 0.7em; }

/* symbol tiles */
.tagsrow { flex: none; display: flex; flex-direction: column; gap: 6px; }
.tags-lbl { display: flex; align-items: center; gap: 10px; }
.tags-lbl button { border: 0; background: none; padding: 0; color: var(--red); }
.tiles { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
.tiles::-webkit-scrollbar { display: none; }
.tile {
  flex: 1 0 70px; max-width: 150px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 64px; padding: 14px 6px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink);
}
.tile .t-idx, .tile .t-n { position: absolute; top: 5px; font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-2); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.tile .t-idx { left: 7px; }
.tile .t-n { right: 7px; }
.tile .t-mark { font-family: var(--f-mono); font-size: 18px; line-height: 1; }
.tile .t-mark.imp { color: var(--red); }
.tile .t-name { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tile[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tile[aria-pressed="true"] .t-name, .tile[aria-pressed="true"] .t-idx, .tile[aria-pressed="true"] .t-n { color: var(--sheet); }
.tile.edit { flex: 0 0 64px; border-style: dashed; background: transparent; }

/* work grid */
.work {
  flex: 1; min-height: 0; display: grid; gap: 10px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: minmax(140px, 42%) minmax(0, 1fr);
  grid-template-areas: "pad pad today" "drop stock make";
}
.card-box { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
.box-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid var(--rule); flex: none; }
.box-head .name { font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.16em; color: var(--c, var(--ink)); }
.box-head .gloss { margin-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.box-act { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.link-btn { white-space: nowrap; border: 0; background: none; padding: 2px 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.link-btn.plain { color: var(--ink-2); }

/* notepad */
.pad { grid-area: pad; position: relative; }
.pad:focus-within { border-color: var(--ink-2); }
.pad textarea {
  flex: 1; min-height: 44px; width: 100%; resize: none; border: 0; outline: none;
  background-color: transparent;
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px);
  background-size: 22px 22px; background-position: 11px 9px; background-attachment: local;
  font-size: 16px; line-height: 22px; padding: 10px 14px; color: var(--ink);
}
.pad textarea::placeholder { color: var(--ink-2); opacity: 0.9; }
.pad-bar { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-top: 1px solid var(--rule); min-width: 0; flex: none; }
.icon-btn {
  height: 32px; min-width: 32px; padding: 0 7px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn svg { width: 16px; height: 16px; }
.route { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-inline: 2px; }
.route::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: none;
  padding: 6px 8px; border-radius: 999px; border: 1px solid var(--rule); background: transparent;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--ink-2)); }
.chip[data-r="auto"]::before { background: conic-gradient(var(--drop) 0 33%, var(--stock) 0 66%, var(--make) 0); }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.save {
  border: 0; border-radius: 6px; background: var(--ink); color: var(--sheet); flex: none;
  font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; padding: 9px 12px;
}

/* TODAY + lanes */
.today { grid-area: today; contain: size; --c: var(--red); }
.lane[data-b="drop"] { grid-area: drop; --c: var(--drop); }
.lane[data-b="stock"] { grid-area: stock; --c: var(--stock); }
.lane[data-b="make"] { grid-area: make; --c: var(--make); }
.mini-inv { width: 13px; height: 10px; color: var(--red); }
.list { list-style: none; margin: 0; padding: 0 12px; overflow: auto; flex: 1; min-height: 0; }
.li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); position: relative; }
.li.has-act .meta { padding-right: 76px; }
.li:last-child { border-bottom: 0; }
.li-body { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 10px; border: 0; background: none; padding: 0; text-align: left; }
.ico {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 12px; line-height: 1; color: var(--ink);
}
.ico.imp { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.ico.dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.txt {
  font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.meta { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-2); min-width: 0; text-transform: uppercase; }
.meta svg { width: 11px; height: 11px; }
.meta .pg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.meta .tg { color: var(--ink); white-space: nowrap; }
.meta .tg.imp { color: var(--red); }
.ex { border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.sorting { color: var(--red); white-space: nowrap; }
.is-pending .txt { opacity: 0.7; }
.to-today {
  position: absolute; right: 0; bottom: 7px; border: 1px dashed color-mix(in srgb, var(--red) 60%, transparent); background: transparent; color: var(--red);
  border-radius: 999px; padding: 3px 8px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em;
}
.check {
  width: 20px; height: 20px; margin-top: 1px; flex: none; border-radius: 4px; border: 1.5px solid var(--ink-2);
  background: transparent; padding: 0; display: grid; place-items: center; color: transparent;
}
.check svg { width: 14px; height: 14px; }
.done .check { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.done .txt { text-decoration: line-through; color: var(--ink-2); }
.carry { color: var(--red); }
.empty { margin: 0; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); max-width: 42ch; }
.filter-note { padding: 6px 12px 0; }

/* tabs (narrow only) */
.tabs { display: none; }

/* overlay sheet */
.sheet-wrap { z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet {
  width: min(640px, 100%); max-height: 100%; display: flex; flex-direction: column;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px 12px 0 0; box-shadow: var(--shadow);
}
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.18em; }
.sheet-head .ghost { margin-left: auto; }
.sheet-body { overflow: auto; min-height: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.grow { flex: 1; }
.btn {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 9px 14px; white-space: nowrap;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); font-weight: 500; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.btn:disabled { opacity: 0.5; cursor: default; }
.field-in {
  width: 100%; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  padding: 9px 11px; font-size: 16px; line-height: 1.5; outline: none;
}
textarea.field-in { resize: vertical; min-height: 96px; }
.field-in:focus { border-color: var(--ink-2); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 6px; }

.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button {
  border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; padding: 8px 11px; line-height: 1;
}
.seg button:last-child { border-right: 0; }
.seg button[data-b="drop"] { --c: var(--drop); }
.seg button[data-b="stock"] { --c: var(--stock); }
.seg button[data-b="make"] { --c: var(--make); }
.seg button[aria-pressed="true"] { background: var(--c); color: var(--sheet); }
.seg.small button { padding: 6px 8px; font-size: 10px; }
.tog {
  border: 1px dashed var(--rule); background: transparent; border-radius: 999px; padding: 6px 11px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
}
.tog[aria-pressed="true"] { background: var(--red); border: 1px solid var(--red); color: var(--sheet); }
.tagchip {
  border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 5px 10px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2);
}
.tagchip b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }
.tagchip b.imp { color: var(--red); }
.tagchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tagchip[aria-pressed="true"] b { color: var(--sheet); }
.tagchip.small { padding: 4px 8px; font-size: 11.5px; }

.src { display: flex; flex-direction: column; gap: 6px; }
.src img { max-width: 100%; max-height: 160px; width: auto; object-fit: contain; align-self: flex-start; border-radius: 4px; border: 1px solid var(--rule); background: var(--paper); cursor: zoom-in; }
.src img.big { max-height: none; cursor: zoom-out; }

.status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.scanline { width: 34px; height: 3px; border-radius: 2px; background: var(--rule); position: relative; overflow: hidden; flex: none; }
.scanline::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--red); border-radius: 2px; animation: sweep 1.1s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.err { color: var(--red); font-size: 14px; line-height: 1.5; margin: 0; }
.muted { color: var(--ink-2); font-size: 13px; line-height: 1.55; margin: 0; }

.rv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.rv.off { opacity: 0.5; }
.rv input[type="checkbox"] { width: 18px; height: 18px; margin: 4px 0 0; accent-color: var(--ink); }
.rv .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rv textarea { width: 100%; resize: none; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); padding: 7px 9px; font-size: 15px; line-height: 1.45; outline: none; overflow: hidden; }
.rv textarea:focus { border-color: var(--ink-2); }
.keep { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.keep input { accent-color: var(--ink); width: 16px; height: 16px; }

.sym { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--rule); border-radius: 6px; }
.sym .mark-in { text-align: center; font-family: var(--f-mono); font-size: 20px; padding: 6px 4px; }
.sym .draw-in { grid-column: 1 / -1; font-size: 14px; }
.sym .idx { font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); }

.log-day { margin: 8px 0 0; }
.log-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.log-row p { margin: 0; flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; text-decoration: line-through; color: var(--ink-2); }

.banner { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; line-height: 1.4; padding: 7px 12px; border: 1px dashed var(--ink-2); border-radius: 6px; color: var(--ink-2); }
.banner button { border: 0; background: none; padding: 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  top: calc(var(--vvt, 0px) + var(--vvh, 100vh) - env(safe-area-inset-bottom, 0px) - 56px);
  background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 8px 16px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow);
}

/* short screens: keyboard up on the Fold leaves roughly a 4:3 area */
.short .field, .short .wordmark, .short .tags-lbl { display: none; }
.short .widget { padding-block: 4px; }

  .work > .today, .work > .lane[data-b] { grid-area: pane; display: none; contain: none; }
  .app[data-tab="today"] .today,
  .app[data-tab="drop"] .lane[data-b="drop"],
  .app[data-tab="stock"] .lane[data-b="stock"],
  .app[data-tab="make"] .lane[data-b="make"] { display: flex; }
}
@media (min-width: 720px) {
  .sheet-wrap { align-items: center; padding-inline: 16px; }
  .sheet { border-radius: 12px; max-height: calc(100% - 24px); }
}
@media (prefers-reduced-motion: reduce) {

}

.ok { color: var(--ink); }
hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }

<body>

<div id="app" class="app fit" data-tab="today">
  <section class="widget" aria-label="Today at a glance">
    <div class="w-top">
      <span class="lbl" id="stamp">— / —</span>
      <span class="lbl" id="score">SCORE 0000</span>
      <div class="w-actions">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const BUCKETS = ['drop', 'stock', 'make'];
const LABEL = { drop: 'DROP', stock: 'STOCK', make: 'MAKE' };
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const ICONS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  pen: '<path d="M4 20l4-1L19 8l-3-3L5 16z"/>',
  page: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1"/>',
};
function icon(name, sw = 2) {
  const t = document.createElement('template');
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  return t.content.firstChild;
}

/* pixel sprites */
const INV_A = ['..X.....X..', '...X...X...', '..XXXXXXX..', '.XX.XXX.XX.', 'XXXXXXXXXXX', 'X.XXXXXXX.X', 'X.X.....X.X', '...XX.XX...'];
const INV_B = ['..X.....X..', 'X..X...X..X', 'X.XXXXXXX.X', 'XXX.XXX.XXX', 'XXXXXXXXXXX', '.XXXXXXXXX.', '..X.....X..', '.X.......X.'];
const CANNON = ['......X......', '.....XXX.....', '.....XXX.....', '.XXXXXXXXXXX.', 'XXXXXXXXXXXXX', 'XXXXXXXXXXXXX', 'XXXXXXXXXXXXX'];
const bm = rows => rows.map((r, y) => [...r].map((c, x) => (c === 'X' ? `M${x} ${y}h1v1h-1z` : '')).join('')).join('');
const PATH_A = bm(INV_A), PATH_B = bm(INV_B);
const INV_SVG = `<svg viewBox="0 0 11 8" shape-rendering="crispEdges" aria-hidden="true"><path class="fa" fill="currentColor" d="${PATH_A}"/><path class="fb" fill="currentColor" d="${PATH_B}"/></svg>`;
$('#cannon').innerHTML = `<svg viewBox="0 0 13 7" shape-rendering="crispEdges" width="20" height="11"><path fill="currentColor" d="${bm(CANNON)}"/></svg>`;
$('#today-inv').innerHTML = `<path fill="currentColor" d="${PATH_A}"/>`;

const pad2 = n => String(n).padStart(2, '0');
const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const startOfDay = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
let TODAY = dayStr();

function rel(ms) {
  if (!ms) return '';
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return mins + 'm';
  const days = Math.round((startOfDay(Date.now()) - startOfDay(ms)) / 86400000);
  if (days === 0) return Math.round(mins / 60) + 'h';
  if (days === 1) return 'yesterday';
  if (days < 7) return new Date(ms).toLocaleDateString('en-AU', { weekday: 'short' });
  return new Date(ms).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}
function dayName(ds) {
  const d = parseDay(ds);
  const days = Math.round((startOfDay(Date.now()) - d.getTime()) / 86400000);
  if (days === 1) return 'yesterday';
  if (days < 7) return d.toLocaleDateString('en-AU', { weekday: 'short' });
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}

/* ---------- symbols (Brain Camera) ---------- */
const DEFAULT_SYMBOLS = [
  { id: 'imp', mark: '!', name: 'Important', draw: 'an exclamation mark in the margin' },
  { id: 'unr', mark: '?', name: 'Unresolved', draw: 'a question mark next to the line' },
  { id: 'task', mark: '☐', name: 'Task', draw: 'a small empty box before the line' },
  { id: 'fup', mark: '→', name: 'Follow-up', draw: 'an arrow pointing right' },
];
const ALTS = { task: ['[ ]', '[]', '□'], fup: ['->', '=>'] };
function cleanSymbols(list) {
  if (!Array.isArray(list)) return null;
  const seen = new Set();
  const out = [];
  for (const s of list.slice(0, 8)) {
    if (!s || typeof s !== 'object') continue;
    const id = String(s.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24);
    const mark = String(s.mark || '').trim().slice(0, 3);
    const name = String(s.name || '').trim().slice(0, 20);
    if (!id || !mark || !name || seen.has(id)) continue;
    seen.add(id);
    out.push({ id, mark, name, draw: String(s.draw || '').trim().slice(0, 100) });
  }
  return out.length ? out : null;
}
const symById = id => state.symbols.find(s => s.id === id);
const knownTags = it => (Array.isArray(it.tags) ? it.tags : []).filter(t => symById(t));

function parseMarks(text) {
  const toks = [];
  for (const s of state.symbols) for (const tok of [s.mark, ...(ALTS[s.id] || [])]) if (tok) toks.push({ id: s.id, tok });
  toks.sort((a, b) => b.tok.length - a.tok.length);
  let t = text;
  const tags = [];
  for (let guard = 0; guard < 8; guard++) {
    const s = t.replace(/^\s+/, '');
    const hit = toks.find(({ tok }) => s.startsWith(tok) && (s.length === tok.length || /\s/.test(s[tok.length]) || !/[A-Za-z0-9]/.test(tok)));
    if (!hit) break;
    if (!tags.includes(hit.id)) tags.push(hit.id);
    t = s.slice(hit.tok.length);
  }
  const rest = t.trim();
  return rest ? { text: rest, tags } : { text: text.trim(), tags: [] };
}

/* ---------- state ---------- */
const state = {
  items: [],
  symbols: DEFAULT_SYMBOLS.map(s => ({ ...s })),
  route: 'stock',
  tab: 'today',
  q: '',
  tag: null,
  sample: null,
  canImages: false,
  assets: null,
  confirmDrop: false,
  sheet: null,
  scan: null,
};
const byId = id => state.items.find(i => i.id === id);

/* ---------- stores ---------- */
function memoryStore() {
  const map = new Map();
  let cb = () => {}, scb = () => {}, settings = null;
  const emit = () => cb([...map.values()]);
  return {
    mode: 'memory',
    subscribe(f) { cb = f; emit(); return () => { cb = () => {}; }; },
    subscribeSettings(f) { scb = f; f(settings); return () => { scb = () => {}; }; },
    async setSettings(d) { settings = d; scb(d); },
    newId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
    async set(id, data) { map.set(id, { ...data, id }); emit(); },
    async update(id, p) { const cur = map.get(id); if (!cur) return; map.set(id, { ...cur, ...p }); emit(); },
    async remove(id) { map.delete(id); emit(); },
    all() { return [...map.values()]; },
  };
}
/* on-phone storage (IndexedDB) */
function openDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('keitan', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function idbReq(db, name, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(name, mode);
    const r = fn(t.objectStore(name));
    t.oncomplete = () => resolve(r ? r.result : undefined);
    t.onerror = t.onabort = () => reject({ code: 'storage', message: String(t.error || 'storage error') });
  });
}
async function localStore() {
  const db = await openDb();
  const rows = (await idbReq(db, 'items', 'readonly', st => st.getAll())) || [];
  const map = new Map(rows.map(i => [i.id, i]));
  let settings = (await idbReq(db, 'kv', 'readonly', st => st.get('settings'))) || null;
  let cb = () => {}, scb = () => {};
  const emit = () => cb([...map.values()]);
  const put = v => idbReq(db, 'items', 'readwrite', st => st.put(v));
  return {
    mode: 'local',
    subscribe(f) { cb = f; emit(); return () => { cb = () => {}; }; },
    subscribeSettings(f) { scb = f; f(settings); return () => { scb = () => {}; }; },
    async setSettings(d) { settings = d; scb(d); await idbReq(db, 'kv', 'readwrite', st => st.put(d, 'settings')); },
    newId() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
    async set(id, data) { const v = { ...data, id }; map.set(id, v); emit(); await put(v); },
    async update(id, p) {
      const cur = map.get(id);
      if (!cur) throw { code: 'invalid_argument' };
      const v = { ...cur, ...p };
      map.set(id, v); emit(); await put(v);
    },
    async remove(id) { map.delete(id); emit(); await idbReq(db, 'items', 'readwrite', st => st.delete(id)); },
    async putPhoto(blob) {
      const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await idbReq(db, 'photos', 'readwrite', st => st.put(blob, id));
      return id;
    },
    getPhoto(id) { return idbReq(db, 'photos', 'readonly', st => st.get(id)); },
    kvGet(k) { return idbReq(db, 'kv', 'readonly', st => st.get(k)); },
    kvSet(k, v) { return idbReq(db, 'kv', 'readwrite', st => st.put(v, k)); },
    kvDel(k) { return idbReq(db, 'kv', 'readwrite', st => st.delete(k)); },
    all() { return [...map.values()]; },
  };
}

/* Anthropic API (your own key) */
const API = 'https://api.anthropic.com/v1';
const apiHeaders = key => ({
  'x-api-key': key,
  'anthropic-version': '2023-06-01',
  'anthropic-dangerous-direct-browser-access': 'true',
  'content-type': 'application/json',
});
async function apiError(r) {
  let msg = '';
  try { const j = await r.json(); msg = (j && j.error && j.error.message) || ''; } catch (e) {}
  const code = r.status === 401 || r.status === 403 ? 'bad_key'
    : r.status === 429 ? 'rate_limited'
    : r.status === 400 || r.status === 404 || r.status === 413 ? 'invalid_request'
    : 'upstream_error';
  return { code, message: msg || ('HTTP ' + r.status) };
}
async function listModels(key) {
  let r;
  try { r = await fetch(API + '/models?limit=100', { headers: apiHeaders(key) }); }
  catch (e) { throw { code: 'network', message: String(e) }; }
  if (!r.ok) throw await apiError(r);
  const j = await r.json();
  return (j.data || []).map(m => String(m.id));
}
function pickModels(ids) {
  const find = w => ids.find(id => id.includes(w));
  return { scan: find('sonnet') || find('opus') || ids[0] || '', sort: find('haiku') || find('sonnet') || ids[0] || '' };
}
function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}
function parseLooseJson(text) {
  const tryParse = t => { try { return JSON.parse(t); } catch (e) { return undefined; } };
  let v = tryParse(text.trim());
  if (v !== undefined) return v;
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { v = tryParse(fence[1].trim()); if (v !== undefined) return v; }
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if (a >= 0 && b > a) return tryParse(text.slice(a, b + 1));
  return undefined;
}
function makeSample(cfg) {
  async function call(prompt, opts = {}) {
    const content = [];
    for (const b of opts.images || []) {
      content.push({ type: 'image', source: { type: 'base64', media_type: b.type || 'image/jpeg', data: await blobToB64(b) } });
    }
    content.push({ type: 'text', text: prompt });
    const model = opts.modelTier === 'quick' ? (cfg.sort || cfg.scan) : (cfg.scan || cfg.sort);
    let r;
    try {
      r = await fetch(API + '/messages', {
        method: 'POST', headers: apiHeaders(cfg.key), signal: opts.signal,
        body: JSON.stringify({ model, max_tokens: opts.images ? 4096 : 400, messages: [{ role: 'user', content }] }),
      });
    } catch (e) {
      if (opts.signal && opts.signal.aborted) throw { code: 'cancelled' };
      throw { code: 'network', message: String(e) };
    }
    if (!r.ok) throw await apiError(r);
    let j;
    try { j = await r.json(); } catch (e) { if (opts.signal && opts.signal.aborted) throw { code: 'cancelled' }; throw { code: 'upstream_error' }; }
    if (j.stop_reason === 'refusal') throw { code: 'refused' };
    const text = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
    if (!text.trim()) throw { code: 'empty_completion' };
    return { text, truncated: j.stop_reason === 'max_tokens' };
  }
  const sample = (p, o) => call(p, o);
  sample.json = async (p, o) => {
    const res = await call(p, o);
    const v = parseLooseJson(res.text);
    if (v === undefined) throw { code: 'invalid_json', text: res.text };
    return v;
  };
  sample.limits = async () => ({ images: { maxCount: 5 } });
  return sample;
}

/* ---------- actions ---------- */
function patch(id, p) { return store.update(id, { ...p, updatedAt: Date.now() }).catch(onWriteError); }

const busy = new Set();
async function shoot(id) {
  if (reduceMotion() || document.body.classList.contains('short')) return;
  const inv = els.grid.querySelector(`.inv[data-id="${CSS.escape(id)}"]`);
  if (!inv || !inv.offsetParent) return;
  const f = els.field.getBoundingClientRect();
  const r = inv.getBoundingClientRect();
  const c = els.cannon.getBoundingClientRect();
  const x = r.left + r.width / 2 - f.left;
  els.cannon.style.left = x + 'px';
  await wait(170);
  const laser = h('span', { class: 'laser', 'aria-hidden': 'true' });
  laser.style.left = x + 'px';
  laser.style.top = (r.bottom - f.top) + 'px';
  laser.style.height = Math.max(4, c.top - r.bottom) + 'px';
  els.field.append(laser);
  await wait(150);
  inv.classList.add('hit');
  await wait(240);
  laser.remove();
  setTimeout(() => { els.cannon.style.left = ''; }, 900);
}
async function toggleDone(id) {
  const it = byId(id);
  if (!it || busy.has(id)) return;
  if (it.done) { patch(id, { done: false, doneAt: null, today: TODAY }); return; }
  busy.add(id);
  try { await shoot(id); } catch (e) {}
  busy.delete(id);
  patch(id, { done: true, doneAt: Date.now() });
}
async function letGoAll(ids) {
  state.confirmDrop = false;
  let n = 0;
  for (const id of ids) {
    try { await store.remove(id); n++; } catch (e) { onWriteError(e); break; }
  }
  if (n) toast(`Let go of ${n} note${n === 1 ? '' : 's'}`);
  render();
}

}

async function submitPad() {
  const raw = els.input.value.trim();
  if (!raw) return;
  els.input.value = '';
  const { text, tags } = parseMarks(raw);
  const route = state.route;
  const actionTag = tags.some(t => t === 'task' || t === 'fup');
  const auto = route === 'auto' && !!state.sample && !actionTag;
  let bucket = route === 'today' ? 'make' : (BUCKETS.includes(route) ? route : 'stock');
  if (route === 'auto' && actionTag) bucket = 'make';
  const now = Date.now();
  const data = {
    text, tags, bucket,
    today: route === 'today' ? TODAY : null,
    done: false, doneAt: null,
    createdAt: now, updatedAt: now,
    source: 'typed', photo: null, page: null,
    pending: auto,
  };
  const id = store.newId();
  const target = store;
  try { await target.set(id, data); }
  catch (e) { els.input.value = raw; onWriteError(e); return; }
  if (!auto && innerWidth < 720) setTab(route === 'today' ? 'today' : bucket);
  if (auto) autoSort(id, text, tags, target);
}

async function autoSort(id, text, tags, target) {
  const legend = state.symbols.map(s => `"${s.id}" = ${s.name}`).join(', ');
  const prompt = `Sort one note from a notebook app.
Buckets: "drop" = fleeting or finished, not useful after today; "stock" = worth keeping (a fact, insight, idea or reference); "make" = something to act on (a task or a thing to create).
Tags you may add, only when clearly implied by the note: ${legend}.

Note:
"""${text.slice(0, 4000)}"""

Reply with only JSON: {"bucket": "drop" | "stock" | "make", "tags": []}`;
  let bucket = null, newTags = tags, err = null;
  try {
    const r = await state.sample.json(prompt, { modelTier: 'quick' });
    bucket = r && BUCKETS.includes(r.bucket) ? r.bucket : 'stock';
    const extra = r && Array.isArray(r.tags) ? r.tags.map(String).filter(t => symById(t)) : [];
    newTags = [...new Set([...tags, ...extra])];
  } catch (e) { err = e; }
  const it = byId(id);
  if (!it || !it.pending || target !== store) return;
  try {
    await target.update(id, bucket ? { bucket, tags: newTags, pending: false, updatedAt: Date.now() } : { pending: false });
  } catch (e) { return; }
  if (bucket) {
    toast(`Sorted to ${LABEL[bucket]}`);
    if (innerWidth < 720) setTab(bucket);
  } else {
    toast('Auto-sort failed, so it went to STOCK.' + (err && err.code === 'rate_limited' ? ' Claude is busy.' : ''));
    disableClaude(err);
  }
}

async function downscale(file, max, quality) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  const w = src.width, hh = src.height;
  if (!w || !hh) throw new Error('empty');
  const k = Math.min(1, max / Math.max(w, hh));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(hh * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('encode'))), 'image/jpeg', quality));
}

function ocrPrompt() {
  const wd = new Date().toLocaleDateString('en-AU', { weekday: 'long' });
  const legend = state.symbols.map(s => `   - id "${s.id}": ${s.mark}${s.draw ? ` (${s.draw})` : ''} = ${s.name}`).join('\n');
  return `You are Brain Camera, the reading-and-sorting step of Keitan, a notebook app that links paper notes to a digital task list.
The image is a phone photo of one page (or a two-page spread) of the user's handwritten notebook. Today is ${wd} ${TODAY}.

1. Read all the handwriting. Ignore ruled lines, dot grids, page numbers, printed notebook branding and anything outside the page.
2. Split the page into separate notes: one idea, fact or task per note. Bullet points and numbered lines are usually separate notes. Keep a heading only as part of the note it belongs to.
3. Keep the writer's own words and language. Only fix obvious misreadings. Write [?] for a word you cannot read. Do not copy the symbols themselves into the text. Add no commentary.
4. The writer marks lines with their own hand-drawn symbols, like a bullet journal:
${legend}
   Put the ids of the symbols drawn next to each note in "tags". If no symbol is drawn but the note clearly is one of these (for example an open question or a to-do), you may add that id. Otherwise leave "tags" empty.
5. Put each note in one bucket:
   "drop" = fleeting or already handled: crossed-out or ticked-off lines, scratch maths, reminders that only matter for a moment.
   "stock" = worth keeping: facts, insights, ideas, references, open questions, names, numbers to remember.
   "make" = something to act on: tasks, to-dos, follow-ups, things to write, build, send, buy or decide.
6. Set "today": true only for a "make" note the writer clearly marked for today (the word "today", today's date, or a mark they use for today). Otherwise false.

Reply with only this JSON:
{"title": "a 2-6 word title for the page", "items": [{"text": "...", "bucket": "stock", "tags": [], "today": false}]}
If the photo has no readable handwriting, reply {"title": "", "items": []}.`;
}

async function startScan(file) {
  if (!state.sample || !state.canImages) { toast('Add your Anthropic API key in Settings to use Brain Camera.'); openSettings(); return; }
  const scan = { status: 'preparing', blob: null, url: null, items: [], title: '', found: 0, error: '', ctl: null,
    keepPhoto: !!store.putPhoto };
  state.scan = scan;
  state.sheet = { kind: 'scan' };
  drawScan();
  try { scan.blob = await downscale(file, 1600, 0.85); }
  catch (e) {
    scan.status = 'error';
    scan.error = "This photo couldn't be opened. Try a JPEG or PNG. On a Samsung camera, turn off High efficiency pictures in camera settings.";
    drawScan();
    return;
  }
  if (state.scan !== scan) return;
  scan.url = URL.createObjectURL(scan.blob);
  readScan(scan);
}

async function readScan(scan) {
  scan.status = 'reading';
  scan.found = 0;
  scan.error = '';
  scan.ctl = new AbortController();
  drawScan();
  try {
    const res = await state.sample.json(ocrPrompt(), {
      images: [scan.blob],
      signal: scan.ctl.signal,
      onText: ({ text }) => {
        const n = (text.match(/"text"\s*:/g) || []).length;
        if (n !== scan.found && state.scan === scan) {
          scan.found = n;
          const el = $('#scan-status');
          if (el) el.textContent = `Reading your handwriting… ${n} note${n === 1 ? '' : 's'} so far`;
        }
      },
    });
    if (state.scan !== scan) return;
    const raw = res && Array.isArray(res.items) ? res.items : [];
    scan.title = String((res && res.title) || '').trim().slice(0, 80);
    scan.items = raw.map(r => {
      const bucket = r && BUCKETS.includes(r.bucket) ? r.bucket : 'stock';
      const tags = r && Array.isArray(r.tags) ? [...new Set(r.tags.map(String).filter(t => symById(t)))] : [];
      return { text: String((r && r.text) || '').trim(), bucket, tags, today: !!(r && r.today) && bucket === 'make', keep: true };
    }).filter(r => r.text);
    scan.status = 'review';
  } catch (e) {
    if (state.scan !== scan) return;
    if (e && e.code === 'cancelled') { closeSheet(); return; }
    scan.status = 'error';
    scan.error = sampleMsg(e);
    disableClaude(e);
  }
  drawScan();
}

function autoGrow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

function drawScan() {
  const scan = state.scan;
  if (!scan) return;
  const body = h('div', { class: 'sheet-body' });
  if (scan.url) {
    body.append(h('div', { class: 'src' },

  }

    body.append(h('div', { class: 'status' }, h('span', { class: 'scanline', 'aria-hidden': 'true' }),
      h('span', { id: 'scan-status', text: scan.status === 'preparing' ? 'Preparing photo…' : 'Reading your handwriting…' })));
    body.append(h('p', { class: 'muted', text: `Claude is transcribing the page, reading your symbols (${state.symbols.map(s => s.mark).join(' ')}) and sorting each line into DROP, STOCK or MAKE. This usually takes 10 to 40 seconds and uses your Anthropic API credit.` }));
    foot.append(h('span', { class: 'grow' }),
      h('button', { class: 'btn', type: 'button', onclick: () => { scan.ctl ? scan.ctl.abort() : closeSheet(); } }, icon('stop'), 'Stop'));

    foot.append(h('span', { class: 'grow' }),
      h('button', { class: 'btn', type: 'button', onclick: closeSheet }, 'Close'),
      scan.blob && state.sample && state.canImages
        ? h('button', { class: 'btn primary', type: 'button', onclick: () => readScan(scan) }, 'Try again') : null);
  } else if (!scan.items.length) {
    body.append(h('p', { class: 'muted', text: 'No handwriting found on this page. Try a closer, well-lit photo with the page filling the frame.' }));
    foot.append(h('span', { class: 'grow' }), h('button', { class: 'btn primary', type: 'button', onclick: closeSheet }, 'Close'));
  } else {
    const title = h('input', { class: 'field-in', id: 'scan-title', type: 'text', 'aria-label': 'Page title', placeholder: 'Page title' });

    title.addEventListener('input', () => { scan.title = title.value; });

    body.append(h('span', { class: 'lbl', text: `${pad2(scan.items.length)} notes found · check text, buckets and symbols` }));
    const addBtn = h('button', { class: 'btn primary', type: 'button', onclick: () => commitScan(addBtn) });
    const syncCount = () => {
      const n = scan.items.filter(r => r.keep && r.text.trim()).length;

      addBtn.disabled = scan.status === 'saving' || n === 0;
    };
    scan.items.forEach((r, i) => {
      const ta = h('textarea', { rows: '1', 'aria-label': `Note ${i + 1}` });
      ta.value = r.text;
      ta.addEventListener('input', () => { r.text = ta.value; autoGrow(ta); syncCount(); });
      requestAnimationFrame(() => autoGrow(ta));
      const tog = h('button', {
        class: 'tog', type: 'button', 'aria-pressed': String(r.today), hidden: r.bucket !== 'make',
        onclick: () => { r.today = !r.today; tog.setAttribute('aria-pressed', String(r.today)); },
      }, 'Today');
      const box = h('input', { type: 'checkbox', 'aria-label': `Include note ${i + 1}` });
      box.checked = r.keep;
      const row = h('div', { class: 'rv' + (r.keep ? '' : ' off') }, box,
        h('div', { class: 'col' }, ta,
          h('div', { class: 'row' },
            segControl(r.bucket, b => { r.bucket = b; if (b !== 'make') r.today = false; tog.hidden = b !== 'make'; tog.setAttribute('aria-pressed', String(r.today)); }, true),
            tog),
          tagChips(r.tags, tags => { r.tags = tags; }, true)));
      box.addEventListener('change', () => { r.keep = box.checked; row.classList.toggle('off', !r.keep); syncCount(); });

    });

    if (store.putPhoto) {

  const scroll = prev ? prev.scrollTop : 0;
  showSheet(h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Brain Camera' },
    head('BRAIN CAMERA', scan.status === 'review' && scan.items.length ? 'review' : ''), body, foot));
  body.scrollTop = scroll;
}

async function commitScan(btn) {
  const scan = state.scan;
  if (!scan || scan.status === 'saving') return;
  const chosen = scan.items.filter(r => r.keep && r.text.trim());
  if (!chosen.length) { closeSheet(); return; }
  scan.status = 'saving';
  btn.textContent = 'Saving…';
  btn.disabled = true;
  let photo = null;
  if (scan.keepPhoto && store.putPhoto) {
    try { photo = await store.putPhoto(scan.blob); }
    catch (e) { toast("Couldn't keep the photo. Saving the notes without it."); }
  }
  const now = Date.now();
  const page = scan.title.trim().slice(0, 80) || null;
  let saved = 0;
  for (let i = 0; i < chosen.length; i++) {
    const r = chosen[i];
    const id = store.newId();
    try {
      await store.set(id, {
        text: r.text.trim(), tags: r.tags, bucket: r.bucket, today: r.today ? TODAY : null,
        done: false, doneAt: null, createdAt: now - i, updatedAt: now,
        source: 'scan', photo, page, pending: false,
      });
      saved++;
    } catch (e) { onWriteError(e); break; }
  }
  closeSheet();
  if (saved) toast(`Added ${saved} note${saved === 1 ? '' : 's'} from your page`);
}

function drawSettings() {

    s.busy = true; s.status = 'Checking your key…'; drawSettings();
    try {
      const ids = await listModels(s.key);
      const pick = pickModels(ids);
      if (!s.scan || !ids.includes(s.scan)) s.scan = pick.scan;
      if (!s.sort || !ids.includes(s.sort)) s.sort = pick.sort;
      if (!s.scan) throw { code: 'invalid_request', message: 'No models are available to this key.' };
      const cfg = { key: s.key, scan: s.scan, sort: s.sort };
      await store.kvSet('api', cfg);
      s.status = `Key works. Brain Camera uses ${s.scan}; Auto sort uses ${s.sort}.`;

    } catch (e) {
      s.status = e && e.code === 'bad_key' ? 'That key was rejected. Copy it again from the Anthropic Console.'

    }
    s.busy = false;

  };
  const removeKey = async () => {
    await store.kvDel('api').catch(() => {});
    s.key = ''; s.scan = ''; s.sort = ''; s.status = 'Key removed from this phone.';
    await loadApi();
    drawSettings();
  };

  const body = h('div', { class: 'sheet-body' },
    h('span', { class: 'lbl', text: 'Anthropic API key' }),
    h('p', { class: 'muted', text: 'Brain Camera and Auto sort call Claude with your own API key. It is stored only on this phone and sent only to api.anthropic.com. Usage is billed to your Anthropic API account, separately from a Claude subscription.' }),

    h('div', { class: 'row' },
      h('button', { class: 'btn primary', type: 'button', disabled: s.busy, onclick: saveKey }, s.busy ? 'Checking…' : 'Save and test'),
      state.api ? h('button', { class: 'btn danger', type: 'button', onclick: removeKey }, 'Remove key') : null),
    s.status ? h('p', { class: 'muted ok', text: s.status }) : null,
    h('div', { class: 'stack' }, h('span', { class: 'lbl', text: 'Model for Brain Camera' }), scan),
    h('div', { class: 'stack' }, h('span', { class: 'lbl', text: 'Model for Auto sort' }), sort),
    h('p', { class: 'muted', text: 'Leave the model boxes as they are. Keitan picks the newest Sonnet for reading pages and the newest Haiku for sorting when you save the key.' }),
    h('hr', { class: 'rule' }),
    h('span', { class: 'lbl', text: 'Backup' }),
    h('p', { class: 'muted', text: `Your ${state.items.length} notes are stored on this phone only. Export a backup now and then. Photos are not included.` }),
    h('div', { class: 'row' },
      h('button', { class: 'btn', type: 'button', onclick: exportBackup }, 'Export backup'),
      h('button', { class: 'btn', type: 'button', onclick: () => $('#file-import').click() }, 'Import backup')),
    s.confirmImport ? h('div', { class: 'stack' },
      h('p', { class: 'muted ok', text: `Import ${s.confirmImport.items.length} notes? Notes with the same ID are replaced; others are kept.` }),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', type: 'button', onclick: () => doImport(s.confirmImport) }, 'Import'),
        h('button', { class: 'btn', type: 'button', onclick: () => { s.confirmImport = null; drawSettings(); } }, 'Cancel'))) : null);

  const prev = $('.sheet-body', els.sheet);
  const scroll = prev ? prev.scrollTop : 0;
  showSheet(h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Settings' },
    head('SETTINGS', ''), body,
    h('div', { class: 'sheet-foot' }, h('span', { class: 'grow' }),
      h('button', { class: 'btn', type: 'button', onclick: async () => {
        if (state.api && (s.scan !== state.api.scan || s.sort !== state.api.sort) && s.scan) {
          const cfg = { ...state.api, scan: s.scan, sort: s.sort || s.scan };
          await store.kvSet('api', cfg).catch(() => {});
          await loadApi();
        }
        closeSheet();
      } }, 'Done'))));
  body.scrollTop = scroll;
}
$('#btn-settings').addEventListener('click', openSettings);

function exportBackup() {
  const data = { app: 'keitan', version: 1, exportedAt: new Date().toISOString(), symbols: state.symbols, items: state.items };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: `keitan-backup-${dayStr()}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Backup exported');
}
$('#file-import').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== 'keitan' || !Array.isArray(data.items)) throw new Error('not a backup');
    if (!state.sheet || state.sheet.kind !== 'settings') openSettings();
    state.sheet.confirmImport = data;
    drawSettings();
  } catch (err) { toast("That file isn't a Keitan backup."); }
});
async function doImport(data) {
  let n = 0;
  for (const it of data.items) {
    if (!it || typeof it.id !== 'string' || typeof it.text !== 'string') continue;
    const { id, ...rest } = it;
    try { await store.set(id, rest); n++; } catch (e) { onWriteError(e); break; }
  }
  const syms = cleanSymbols(data.symbols);
  if (syms) await store.setSettings({ symbols: syms, updatedAt: Date.now() }).catch(() => {});
  if (state.sheet && state.sheet.kind === 'settings') { state.sheet.confirmImport = null; state.sheet.status = `Imported ${n} notes.`; drawSettings(); }
}

async function boot() {
  drawDates();
  try {
    store = await localStore();
  } catch (e) {
    store = memoryStore();
    bannerMsg = "This browser won't let Keitan save notes, so anything written now disappears when you close it.";
  }
  if (store.kvGet) {
    const seeded = await store.kvGet('seeded').catch(() => true);
    if (!seeded) {
      const now = Date.now();
      for (let i = 0; i < EXAMPLES.length; i++) {
        const ex = EXAMPLES[i];
        await store.set(store.newId(), {
          text: ex.text, tags: ex.tags, bucket: ex.bucket, today: ex.today ? TODAY : null,
          done: false, doneAt: null, createdAt: now - (i + 1) * 60000, updatedAt: now,
          source: ex.source, photo: null, page: ex.page, pending: false, example: true,
        }).catch(() => {});
      }
      await store.kvSet('seeded', true).catch(() => {});
    }
  }
  unsub = store.subscribe(onItems);
  unsubS = store.subscribeSettings(onSettings);
  await loadApi();
  try { els.input.focus({ preventScroll: true }); } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

// day rollover + relative times
setInterval(() => {
  const d = dayStr();
  if (d !== TODAY) { TODAY = d; drawDates(); }
  render();
}, 60000);

boot();
})();
</script>
</body>
</html>
