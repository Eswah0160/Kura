<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Kura</title>
<meta name="description" content="Kura: a notebook home for paper notes and AI. Write instantly, scan handwritten pages, sort into DROP, STOCK, MAKE and TODAY.">
<meta name="theme-color" id="theme-color" content="#111110">
<script>
/* Match the phone's status bar to the app's own background in light and dark mode.
   Android Chrome ignores media-based theme-color tags, so keep one tag and update it. */
(function () {
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function sync() {
    var dark = mq ? mq.matches : false;
    var meta = document.getElementById('theme-color');
    if (meta) meta.setAttribute('content', dark ? '#111110' : '#E7E7E4');
  }
  sync();
  if (mq && mq.addEventListener) mq.addEventListener('change', sync);
  document.addEventListener('visibilitychange', sync);
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=18" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=18">
<meta name="apple-mobile-web-app-title" content="Kura">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: launcher-style home. A widget card (date, score, pixel invaders for open tasks, spaced wordmark),
   a numbered row of symbol tiles, then the notepad with TODAY beside it and three list lanes below.
   Everything is sized to the visible area above the on-screen keyboard. */
:root {
  --work: #2a78d6; --personal: #1baf7a; --fun: #eb6834;
  --heat-0: #E0E0DC; --heat-1: #86b6ef; --heat-2: #5598e7; --heat-3: #2a78d6; --heat-4: #1c5cab;
  --paper: #E7E7E4;
  --sheet: #F6F6F3;
  --ink: #262625;
  --ink-2: #7A7A76;
  --rule: #D3D3CF;
  --dot: #D5D5D1;
  --red: #DE4336;
  --drop: #9A9A96;
  --stock: #3A3A38;
  --make: #DE4336;
  --scrim: rgba(30, 30, 28, 0.38);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.03), 0 10px 24px -18px rgba(0, 0, 0, 0.35);
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-body: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #8D8D88; --rule: #2C2C2A; --dot: #2F2F2D;
    --red: #FF5B4D; --drop: #7F7F7B; --stock: #D8D8D4; --make: #FF5B4D;
    --work: #3987e5; --personal: #199e70; --fun: #d95926;
    --heat-0: #2C2C2A; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 24px -16px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #8D8D88; --rule: #2C2C2A; --dot: #2F2F2D;
  --red: #FF5B4D; --drop: #7F7F7B; --stock: #D8D8D4; --make: #FF5B4D;
    --work: #3987e5; --personal: #199e70; --fun: #d95926;
    --heat-0: #2C2C2A; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 24px -16px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
svg { display: block; flex: none; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* fitted to the visible viewport (keyboard-aware) */
.fit {
  position: fixed; left: 0; right: 0;
  top: calc(var(--vvt, 0px) + env(safe-area-inset-top, 0px));
  height: calc(var(--vvh, 100vh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.kb .fit { height: calc(var(--vvh, 100vh) - env(safe-area-inset-top, 0px)); }
.app { display: flex; flex-direction: column; gap: 10px; max-width: 1240px; margin: 0 auto; padding: 10px 16px 12px; }

/* widget card */
.widget {
  flex: none; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 4px; position: relative;
}
.w-top { display: flex; align-items: center; gap: 16px; min-height: 30px; }
.w-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ghost {
  height: 30px; min-width: 30px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
}
.ghost svg { width: 16px; height: 16px; }
.search { display: flex; align-items: center; position: relative; }
.search svg { position: absolute; left: 8px; width: 14px; height: 14px; color: var(--ink-2); pointer-events: none; }
.search input {
  height: 30px; width: 190px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  padding: 0 8px 0 28px; font-family: var(--f-mono); font-size: 12px; outline: none;
}
.search input:focus { border-color: var(--ink-2); }
#btn-search { display: none; }

.field { position: relative; padding: 6px 0 16px; }
.inv-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; max-height: 76px; overflow: hidden; padding: 2px 8px; }
.inv { width: 22px; height: 16px; padding: 0; border: 0; background: none; color: var(--ink-2); }
.inv.red { color: var(--red); }
.inv svg { width: 100%; height: 100%; }
.inv .fb { opacity: 0; }
.inv .fa { animation: frameA 1.4s linear infinite; }
.inv .fb { animation: frameB 1.4s linear infinite; }
@keyframes frameA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes frameB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
.inv.hit { animation: hit 0.28s ease-out forwards; }
@keyframes hit { 0% { transform: scale(1); } 35% { transform: scale(1.6); color: var(--red); } 100% { transform: scale(0.2); opacity: 0; } }
.more { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); align-self: center; letter-spacing: 0.1em; }
.all-clear { text-align: center; padding: 8px 0 2px; }
.cannon { position: absolute; bottom: 0; left: 50%; width: 20px; height: 11px; transform: translateX(-50%); color: var(--ink); transition: left 0.16s ease; }
.laser { position: absolute; width: 2px; background: var(--red); transform: translateX(-50%) scaleY(0); transform-origin: bottom; animation: laser 0.16s ease-out forwards; }
@keyframes laser { to { transform: translateX(-50%) scaleY(1); } }
.wordmark {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  border: 0; border-top: 1px solid var(--rule); background: none; padding: 8px 4px 4px; cursor: text;
  font-family: var(--f-mono); font-weight: 300; font-size: clamp(20px, 4.2vw, 34px); line-height: 1; color: var(--ink-2);
}
.wordmark .arr { font-size: 0.7em; }

/* symbol tiles */
.tagsrow { flex: none; display: flex; flex-direction: column; gap: 6px; }
.tags-lbl { display: flex; align-items: center; gap: 10px; }
.tags-lbl button { border: 0; background: none; padding: 0; color: var(--red); }
.tiles { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
.tiles::-webkit-scrollbar { display: none; }
.tile {
  flex: 1 0 70px; max-width: 150px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 64px; padding: 14px 6px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink);
}
.tile .t-idx, .tile .t-n { position: absolute; top: 5px; font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-2); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.tile .t-idx { left: 7px; }
.tile .t-n { right: 7px; }
.tile .t-mark { font-family: var(--f-mono); font-size: 18px; line-height: 1; }
.tile .t-mark.imp { color: var(--red); }
.tile .t-name { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tile[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tile[aria-pressed="true"] .t-name, .tile[aria-pressed="true"] .t-idx, .tile[aria-pressed="true"] .t-n { color: var(--sheet); }
.tile.edit { flex: 0 0 64px; border-style: dashed; background: transparent; }

/* work grid */
.work {
  flex: 1; min-height: 0; display: grid; gap: 10px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: minmax(140px, 42%) minmax(0, 1fr);
  grid-template-areas: "pad pad today" "drop stock make";
}
.card-box { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
.box-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid var(--rule); flex: none; }
.box-head .name { font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.16em; color: var(--c, var(--ink)); }
.box-head .gloss { margin-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.box-act { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.link-btn { white-space: nowrap; border: 0; background: none; padding: 2px 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.link-btn.plain { color: var(--ink-2); }

/* notepad */
.pad { grid-area: pad; position: relative; }
.pad:focus-within { border-color: var(--ink-2); }
.pad textarea {
  flex: 1; min-height: 44px; width: 100%; resize: none; border: 0; outline: none;
  background-color: transparent;
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px);
  background-size: 22px 22px; background-position: 11px 9px; background-attachment: local;
  font-size: 16px; line-height: 22px; padding: 10px 14px; color: var(--ink);
}
.pad textarea::placeholder { color: var(--ink-2); opacity: 0.9; }
.pad-bar { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-top: 1px solid var(--rule); min-width: 0; flex: none; }
.icon-btn {
  height: 32px; min-width: 32px; padding: 0 7px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn svg { width: 16px; height: 16px; }
.route { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-inline: 2px; }
.route::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: none;
  padding: 6px 8px; border-radius: 999px; border: 1px solid var(--rule); background: transparent;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--ink-2)); }
.chip[data-r="auto"]::before { background: conic-gradient(var(--drop) 0 33%, var(--stock) 0 66%, var(--make) 0); }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.save {
  border: 0; border-radius: 6px; background: var(--ink); color: var(--sheet); flex: none;
  font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; padding: 9px 12px;
}

/* TODAY + lanes */
.today { grid-area: today; contain: size; --c: var(--red); }
.lane[data-b="drop"] { grid-area: drop; --c: var(--drop); }
.lane[data-b="stock"] { grid-area: stock; --c: var(--stock); }
.lane[data-b="make"] { grid-area: make; --c: var(--make); }
.mini-inv { width: 13px; height: 10px; color: var(--red); }
.list { list-style: none; margin: 0; padding: 0 12px; overflow: auto; flex: 1; min-height: 0; }
.li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); position: relative; }
.li.has-act .meta { padding-right: 76px; }
.li:last-child { border-bottom: 0; }
.li-body { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 10px; border: 0; background: none; padding: 0; text-align: left; }
.ico {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 12px; line-height: 1; color: var(--ink);
}
.ico.imp { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.ico.dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.txt {
  font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.meta { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-2); min-width: 0; text-transform: uppercase; }
.meta svg { width: 11px; height: 11px; }
.meta .pg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.meta .tg { color: var(--ink); white-space: nowrap; }
.meta .tg.imp { color: var(--red); }
.ex { border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.sorting { color: var(--red); white-space: nowrap; }
.is-pending .txt { opacity: 0.7; }
.to-today {
  position: absolute; right: 0; bottom: 7px; border: 1px dashed color-mix(in srgb, var(--red) 60%, transparent); background: transparent; color: var(--red);
  border-radius: 999px; padding: 3px 8px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em;
}
.check {
  width: 20px; height: 20px; margin-top: 1px; flex: none; border-radius: 4px; border: 1.5px solid var(--ink-2);
  background: transparent; padding: 0; display: grid; place-items: center; color: transparent;
}
.check svg { width: 14px; height: 14px; }
.done .check { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.done .txt { text-decoration: line-through; color: var(--ink-2); }
.carry { color: var(--red); }
.empty { margin: 0; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); max-width: 42ch; }
.filter-note { padding: 6px 12px 0; }

/* tabs (narrow only) */
.tabs { display: none; }

/* overlay sheet */
.sheet-wrap { z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet {
  width: min(640px, 100%); max-height: 100%; display: flex; flex-direction: column;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px 12px 0 0; box-shadow: var(--shadow);
}
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.18em; }
.sheet-head .ghost { margin-left: auto; }
.sheet-body { overflow: auto; min-height: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.grow { flex: 1; }
.btn {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 9px 14px; white-space: nowrap;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); font-weight: 500; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.btn:disabled { opacity: 0.5; cursor: default; }
.field-in {
  width: 100%; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  padding: 9px 11px; font-size: 16px; line-height: 1.5; outline: none;
}
textarea.field-in { resize: vertical; min-height: 96px; }
.field-in:focus { border-color: var(--ink-2); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 6px; }

.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button {
  border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; padding: 8px 11px; line-height: 1;
}
.seg button:last-child { border-right: 0; }
.seg button[data-b="drop"] { --c: var(--drop); }
.seg button[data-b="stock"] { --c: var(--stock); }
.seg button[data-b="make"] { --c: var(--make); }
.seg button[aria-pressed="true"] { background: var(--c); color: var(--sheet); }
.seg.small button { padding: 6px 8px; font-size: 10px; }
.tog {
  border: 1px dashed var(--rule); background: transparent; border-radius: 999px; padding: 6px 11px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
}
.tog[aria-pressed="true"] { background: var(--red); border: 1px solid var(--red); color: var(--sheet); }
.tagchip {
  border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 5px 10px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2);
}
.tagchip b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }
.tagchip b.imp { color: var(--red); }
.tagchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tagchip[aria-pressed="true"] b { color: var(--sheet); }
.tagchip.small { padding: 4px 8px; font-size: 11.5px; }

.src { display: flex; flex-direction: column; gap: 6px; }
.src img { max-width: 100%; max-height: 160px; width: auto; object-fit: contain; align-self: flex-start; border-radius: 4px; border: 1px solid var(--rule); background: var(--paper); cursor: zoom-in; }
.src img.big { max-height: none; cursor: zoom-out; }

.status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.scanline { width: 34px; height: 3px; border-radius: 2px; background: var(--rule); position: relative; overflow: hidden; flex: none; }
.scanline::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--red); border-radius: 2px; animation: sweep 1.1s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.err { color: var(--red); font-size: 14px; line-height: 1.5; margin: 0; }
.muted { color: var(--ink-2); font-size: 13px; line-height: 1.55; margin: 0; }

.rv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.rv.off { opacity: 0.5; }
.rv input[type="checkbox"] { width: 18px; height: 18px; margin: 4px 0 0; accent-color: var(--ink); }
.rv .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rv textarea { width: 100%; resize: none; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); padding: 7px 9px; font-size: 15px; line-height: 1.45; outline: none; overflow: hidden; }
.rv textarea:focus { border-color: var(--ink-2); }
.keep { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.keep input { accent-color: var(--ink); width: 16px; height: 16px; }

.sym { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--rule); border-radius: 6px; }
.sym .mark-in { text-align: center; font-family: var(--f-mono); font-size: 20px; padding: 6px 4px; }
.sym .draw-in { grid-column: 1 / -1; font-size: 14px; }

/* pixel sprites */
const INV_A = ['..X.....X..', '...X...X...', '..XXXXXXX..', '.XX.XXX.XX.', 'XXXXXXXXXXX', 'X.XXXXXXX.X', 'X.X.....X.X', '...XX.XX...'];

const pad2 = n => String(n).padStart(2, '0');

const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const startOfDay = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };

function rel(ms) {
  if (!ms) return '';
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return mins + 'm';
  const days = Math.round((startOfDay(Date.now()) - startOfDay(ms)) / 86400000);
  if (days === 0) return Math.round(mins / 60) + 'h';
  if (days === 1) return 'yesterday';
  if (days < 7) return new Date(ms).toLocaleDateString('en-AU', { weekday: 'short' });
  return new Date(ms).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}

  if (days === 1) return 'tomorrow';
  if (days > 1 && days < 7) return d.toLocaleDateString('en-AU', { weekday: 'short' });
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}

/* ---------- symbols (Brain Camera) ---------- */
const DEFAULT_SYMBOLS = [
  { id: 'imp', mark: '!', name: 'Important', draw: 'an exclamation mark in the margin' },
  { id: 'unr', mark: '?', name: 'Unresolved', draw: 'a question mark next to the line' },
  { id: 'task', mark: '☐', name: 'Task', draw: 'a small empty box before the line' },
  { id: 'fup', mark: '→', name: 'Follow-up', draw: 'an arrow pointing right' },
];
const ALTS = { task: ['[ ]', '[]', '□'], fup: ['->', '=>'] };
function cleanSymbols(list) {
  if (!Array.isArray(list)) return null;
  const seen = new Set();
  const out = [];
  for (const s of list.slice(0, 8)) {
    if (!s || typeof s !== 'object') continue;
    const id = String(s.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24);
    const mark = String(s.mark || '').trim().slice(0, 3);
    const name = String(s.name || '').trim().slice(0, 20);
    if (!id || !mark || !name || seen.has(id)) continue;
    seen.add(id);
    out.push({ id, mark, name, draw: String(s.draw || '').trim().slice(0, 100) });
  }
  return out.length ? out : null;
}
const symById = id => state.symbols.find(s => s.id === id);
const knownTags = it => (Array.isArray(it.tags) ? it.tags : []).filter(t => symById(t));

function parseMarks(text) {
  const toks = [];
  for (const s of state.symbols) for (const tok of [s.mark, ...(ALTS[s.id] || [])]) if (tok) toks.push({ id: s.id, tok });
  toks.sort((a, b) => b.tok.length - a.tok.length);
  let t = text;
  const tags = [];
  for (let guard = 0; guard < 8; guard++) {
    const s = t.replace(/^\s+/, '');
    const hit = toks.find(({ tok }) => s.startsWith(tok) && (s.length === tok.length || /\s/.test(s[tok.length]) || !/[A-Za-z0-9]/.test(tok)));
    if (!hit) break;
    if (!tags.includes(hit.id)) tags.push(hit.id);
    t = s.slice(hit.tok.length);
  }
  const rest = t.trim();
  return rest ? { text: rest, tags } : { text: text.trim(), tags: [] };
}

/* ---------- state ---------- */

/* ---------- stores ---------- */
function memoryStore() {
  const map = new Map();
  let cb = () => {}, scb = () => {}, settings = null;
  const emit = () => cb([...map.values()]);
  return {
    mode: 'memory',
    subscribe(f) { cb = f; emit(); return () => { cb = () => {}; }; },
    subscribeSettings(f) { scb = f; f(settings); return () => { scb = () => {}; }; },
    async setSettings(d) { settings = d; scb(d); },
    newId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
    async set(id, data) { map.set(id, { ...data, id }); emit(); },
    async update(id, p) { const cur = map.get(id); if (!cur) return; map.set(id, { ...cur, ...p }); emit(); },
    async remove(id) { map.delete(id); emit(); },
    _notes: new Map(),
    async listNotes() { return [...this._notes.values()]; },

/* on-phone storage (IndexedDB) */
function openDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('keitan', 3);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('glossary')) db.createObjectStore('glossary', { keyPath: 'id' });
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function idbReq(db, name, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(name, mode);
    const r = fn(t.objectStore(name));
    t.oncomplete = () => resolve(r ? r.result : undefined);
    t.onerror = t.onabort = () => reject({ code: 'storage', message: String(t.error || 'storage error') });
  });
}
async function localStore() {
  const db = await openDb();
  const rows = (await idbReq(db, 'items', 'readonly', st => st.getAll())) || [];
  const map = new Map(rows.map(i => [i.id, i]));
  let settings = (await idbReq(db, 'kv', 'readonly', st => st.get('settings'))) || null;
  let cb = () => {}, scb = () => {};
  const emit = () => cb([...map.values()]);
  const put = v => idbReq(db, 'items', 'readwrite', st => st.put(v));
  return {
    mode: 'local',
    subscribe(f) { cb = f; emit(); return () => { cb = () => {}; }; },
    subscribeSettings(f) { scb = f; f(settings); return () => { scb = () => {}; }; },
    async setSettings(d) { settings = d; scb(d); await idbReq(db, 'kv', 'readwrite', st => st.put(d, 'settings')); },
    newId() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
    async set(id, data) { const v = { ...data, id }; map.set(id, v); emit(); await put(v); },
    async update(id, p) {
      const cur = map.get(id);
      if (!cur) throw { code: 'invalid_argument' };
      const v = { ...cur, ...p };
      map.set(id, v); emit(); await put(v);
    },
    async remove(id) { map.delete(id); emit(); await idbReq(db, 'items', 'readwrite', st => st.delete(id)); },
    async putPhoto(blob) {
      const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await idbReq(db, 'photos', 'readwrite', st => st.put(blob, id));
      return id;
    },
    getPhoto(id) { return idbReq(db, 'photos', 'readonly', st => st.get(id)); },
    kvGet(k) { return idbReq(db, 'kv', 'readonly', st => st.get(k)); },
    kvSet(k, v) { return idbReq(db, 'kv', 'readwrite', st => st.put(v, k)); },
    kvDel(k) { return idbReq(db, 'kv', 'readwrite', st => st.delete(k)); },
    async listNotes() { return (await idbReq(db, 'notes', 'readonly', st => st.getAll())) || []; },
    putNote(n) { return idbReq(db, 'notes', 'readwrite', st => st.put(n)); },
    deleteNote(id) { return idbReq(db, 'notes', 'readwrite', st => st.delete(id)); },
    async listTerms() { return (await idbReq(db, 'glossary', 'readonly', st => st.getAll())) || []; },
    putTerm(g) { return idbReq(db, 'glossary', 'readwrite', st => st.put(g)); },
    deleteTerm(id) { return idbReq(db, 'glossary', 'readwrite', st => st.delete(id)); },
    all() { return [...map.values()]; },
  };
}

/* AI calls: retry a busy model once, fall back to other current models, and replace a saved model Google or Anthropic has retired */
const modelGone = e => !!e && (e.status === 404 || (e.code === 'invalid_request' && /model|not found|not supported/i.test(e.message || '')) || (e.code === 'quota' && /limit:\s*0\b/.test(e.message || '')));
const modelBusy = e => !!e && (e.status >= 500 || e.code === 'upstream_error' || e.code === 'empty_completion');
const modelSkip = e => modelGone(e) || modelBusy(e) || (!!e && (e.code === 'quota' || e.code === 'rate_limited' || e.status === 429));
const modelCool = new Map();   // models that were busy in the last few minutes go to the back of the queue
const cooling = m => Date.now() - (modelCool.get(m) || 0) < 180000;
async function callHealing(cfg, opts, run, candidatesFor) {
  const quick = opts.modelTier === 'quick';
  const which = quick ? 'sort' : 'scan';
  const primary = quick ? (cfg.sort || cfg.scan) : (cfg.scan || cfg.sort);
  const saved = [primary, cfg.scan, cfg.sort].filter((m, i, a) => m && a.indexOf(m) === i);
  const queue = [...saved.filter(m => !cooling(m)), ...saved.filter(cooling)];
  const tried = new Set();
  let last = null, primaryGone = false, listed = false, attempts = 0;
  const aborted = () => !!(opts.signal && opts.signal.aborted);
  while (attempts < 7) {
    if (!queue.length) {
      if (listed || !last) break;
      listed = true;
      try { const more = (await candidatesFor(quick)).filter(m => !tried.has(m)); queue.push(...[...more.filter(m => !cooling(m)), ...more.filter(cooling)].slice(0, 4)); } catch (e) { break; }
      if (!queue.length) break;
    }
    const model = queue.shift();
    if (tried.has(model)) continue;
    tried.add(model);
    for (let retry = 0; retry < 2; retry++) {
      attempts++;
      try {
        const res = await run(model);
        if (primaryGone && model !== primary) healModel(cfg, which, primary, model);
        return res;
      } catch (e) {
        last = e;
        if (aborted() || !modelSkip(e)) throw e;
        if (model === primary && modelGone(e)) primaryGone = true;
        if (modelBusy(e)) modelCool.set(model, Date.now());
        if (!(retry === 0 && modelBusy(e) && queue.length + (listed ? 0 : 1) > 0)) break;
        await wait(900);   // busy or overloaded: one more try on the same model
        if (aborted()) throw { code: 'cancelled' };
      }
    }
  }
  if (last && typeof last === 'object') last.tried = [...tried];
  throw last;
}
function healModel(cfg, which, old, model) {
  cfg[which] = model;
  if (state.api && cfg === state.api) {
    if (store.kvSet) store.kvSet('api', { provider: cfg.provider, key: cfg.key, scan: cfg.scan, sort: cfg.sort }).catch(() => {});
    modelCool.delete(model);
    toast(`AI model ${old} isn't available any more. Kura switched to ${model}.`);
  }
}

/* Anthropic API (your own key) */
const API = 'https://api.anthropic.com/v1';

    const fr = new FileReader();

    fr.onerror = () => reject(fr.error);

}
function parseLooseJson(text) {

  let v = tryParse(text.trim());

  if (fence) { v = tryParse(fence[1].trim()); if (v !== undefined) return v; }
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if (a >= 0 && b > a) return tryParse(text.slice(a, b + 1));
  return undefined;
}

const GEMINI = 'https://generativelanguage.googleapis.com/v1beta';
async function geminiError(r) {

  try { const j = await r.json(); msg = (j && j.error && j.error.message) || ''; st = (j && j.error && j.error.status) || ''; } catch (e) {}
  const code = (r.status === 400 && /api key/i.test(msg)) || r.status === 401 || r.status === 403 ? 'bad_key'

async function listGeminiModels(key) {
  const out = [];

    let r;
    try { r = await fetch(`${GEMINI}/models?pageSize=1000${token ? '&pageToken=' + encodeURIComponent(token) : ''}`, { headers: { 'x-goog-api-key': key } }); }
    catch (e) { throw { code: 'network', message: String((e && e.message) || e) }; }
    if (!r.ok) throw await geminiError(r);
    const j = await r.json();
    for (const m of j.models || []) {
      if ((m.supportedGenerationMethods || []).includes('generateContent')) out.push(String(m.name || '').replace(/^models\//, ''));

function rankGemini(ids) {
  const usable = ids.filter(id => /^gemini-/.test(id) && !/(live|tts|audio|image|transcribe|embedding|robotics|computer|native|learnlm)/i.test(id));
  const ver = id => { const m = /^gemini-(\d+(?:\.\d+)?)/.exec(id); return m ? parseFloat(m[1]) : 0; };
  const shaky = id => /preview|exp/.test(id);
  const alias = id => /latest/.test(id);
  // stable versions first (newest first), then the -latest aliases, then previews
  const rank = list => list.sort((a, b) => (shaky(a) - shaky(b)) || (alias(a) - alias(b)) || (ver(b) - ver(a)) || a.length - b.length);
  return {
    flash: rank(usable.filter(id => /-flash(?!-lite)/.test(id))),
    lite: rank(usable.filter(id => /-flash-lite/.test(id))),
    other: rank(usable.filter(id => !/-flash/.test(id))),
  };
}
function pickGeminiModels(ids) {
  const r = rankGemini(ids);
  const scan = r.flash[0] || r.lite[0] || r.other[0] || '';
  return { scan, sort: r.lite[0] || scan };
}
function makeGemini(cfg) {

    const body = { contents: [{ role: 'user', parts }] };

    let r;
    try {
      r = await fetch(`${GEMINI}/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST', signal: opts.signal,
        headers: { 'x-goog-api-key': cfg.key, 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (e) {
      if (opts.signal && opts.signal.aborted) throw { code: 'cancelled' };
      throw { code: 'network', message: String((e && e.message) || e) };
    }
    if (!r.ok) { const err = await geminiError(r); err.model = model; throw err; }
    let j;
    try { j = await r.json(); } catch (e) { if (opts.signal && opts.signal.aborted) throw { code: 'cancelled' }; throw { code: 'upstream_error', message: 'the reply was cut off or not JSON', model }; }
    if (j.promptFeedback && j.promptFeedback.blockReason) throw { code: 'refused' };
    const cand = (j.candidates || [])[0] || {};
    if (/SAFETY|PROHIBITED|BLOCKLIST/.test(cand.finishReason || '')) throw { code: 'refused' };
    const text = ((cand.content && cand.content.parts) || []).filter(p => typeof p.text === 'string' && !p.thought).map(p => p.text).join('');
    if (!text.trim()) throw { code: 'empty_completion' };

  async function call(prompt, opts = {}) {
    const parts = [];

    parts.push({ text: prompt });
    return callHealing(cfg, opts, model => callModel(model, parts, opts), candidatesFor);
  }
  let listing = null;
  async function candidatesFor(quick) {
    const ids = await (listing || (listing = listGeminiModels(cfg.key).catch(e => { listing = null; throw e; })));
    const r = rankGemini(ids);

    const res = await call(p, { ...o, json: true });
    const v = parseLooseJson(res.text);
    if (v === undefined) throw { code: 'invalid_json', text: res.text };

  };

}

/* on-phone sorting rules: free, offline, used when no AI is set up or it is unavailable */
const RX_ACTION = /^(please\s+)?(call|phone|ring|email|e-mail|text|message|reply|book|buy|order|pay|send|write|draft|finish|fix|make|prepare|prep|submit|review|check|ask|remind|schedule|plan|clean|pick up|collect|return|renew|update|print|read|follow up|chase|organi[sz]e|set up|setup|install|cancel|confirm|arrange|register|apply|meet|visit|go to|get|do|try|test|run|measure|calibrate|analy[sz]e|upload|download|share|post|practi[sc]e|study|learn|research|find|look up|sort out|tidy|charge|refill|move|file|email)\b/i;
const RX_TODO = /\b(to-?do|need to|needs to|must|have to|has to|don'?t forget|remember to|deadline|due (on|by)|by (mon|tue|wed|thu|fri|sat|sun|tomorrow|tonight|next week)|by \d{1,2}(st|nd|rd|th)?\b)/i;
const RX_QUESTION = /\?\s*$|^(why|how|what|when|where|which|who|should|could|would|is|are|does|can)\b/i;
const RX_FLEETING = /\b(moved to|rescheduled|cancel+ed|on my way|running late|eta|parking|wi-?fi|password|door code|room \d+|table \d+|gate \d+)\b/i;
const RX_IMPORTANT = /\b(important|crucial|critical|key point|urgent|asap)\b|!!/i;
function ruleSort(text, tags = []) {
  const t = String(text || '').trim();
  const out = new Set(tags);
  if (RX_IMPORTANT.test(t) && symById('imp')) out.add('imp');
  let bucket = 'stock';
  if (tags.some(x => x === 'task' || x === 'fup') || RX_ACTION.test(t) || RX_TODO.test(t)) bucket = 'make';
  else if (RX_FLEETING.test(t)) bucket = 'drop';
  if (bucket !== 'make' && RX_QUESTION.test(t) && symById('unr')) out.add('unr');
  return { bucket, tags: [...out] };
}
function splitPasted(text) {
  return String(text || '').replace(/\r/g, '').split('\n')
    .map(l => l.replace(/^\s*(?:[*•·▪◦‣]|-(?!>)|\d{1,2}[.)])\s+/, '').trim())
    .filter(Boolean)
    .map(l => {
      const { text: t, tags } = parseMarks(l);
      const r = ruleSort(t, tags);
      return { text: t, bucket: r.bucket, tags: r.tags, today: false, keep: true };
    });
}

/* ---------- keyboard-aware fit ---------- */
function fit() {
  const vv = window.visualViewport;
  const hgt = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  const root = document.documentElement;
  root.style.setProperty('--vvh', hgt + 'px');
  root.style.setProperty('--vvt', top + 'px');
  const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
  const kb = !!vv && (window.innerHeight - vv.height > 140 || (typing && screen.height && screen.height - vv.height > screen.height * 0.4));
  document.body.classList.toggle('kb', kb);
  document.body.classList.toggle('short', hgt < 640);
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fit);
  visualViewport.addEventListener('scroll', fit);
}

function dbMsg(e) {

    case 'quota_exceeded': return 'Your notebook is full. Let some DROP notes go to make room.';
    case 'invalid_argument': return "This couldn't be saved from this view.";
    case 'resource_exhausted': return 'Saving too fast. Wait a moment and try again.';
    case 'revoked': case 'not_granted': case 'capability_disabled': case 'capability_removed':
      return 'Saving is unavailable in this view.';
    default: return "Couldn't save. Check your connection and try again.";
  }
}
const onWriteError = e => toast(dbMsg(e));
function sampleMsg(e) {
  switch (e && e.code) {
    case 'bad_key': return 'Your API key was rejected. Check it in Settings.';
    case 'quota': return 'The free Gemini limit is used up for now. It resets over time (daily limits reset each day).';
    case 'rate_limited': return 'Rate limit reached. Wait a minute and try again.';

    case 'refused': return "Claude couldn't read this page. Try another photo.";

    case 'invalid_request': return 'The AI service said: ' + ((e && e.message) || 'the request was invalid.') + ' Check the model names and credit balance in Settings.';
    case 'no_key': return 'Add a free Gemini key in Settings to read photos, or paste the text instead.';
    case 'cancelled': return 'The AI request was stopped before it finished. Try again.';
    case 'upstream_error': return (e.status === 503 || /overload|unavailable|high demand/i.test(e.message || ''))

async function shoot(id) {
  if (state.theme === 'pets') return befriend(id);
  if (reduceMotion() || document.body.classList.contains('short')) return;
  const inv = els.grid.querySelector(`.inv[data-id="${CSS.escape(id)}"]`);

async function saveDirect() {
  const raw = els.input.value.trim();
  if (!raw) return;
  els.input.value = '';
  const parsed = parseMarks(raw);
  const pj = takeProject(parsed.text);
  let text = pj.text;
  let tags = parsed.tags;
  const route = state.route;
  const when = !state.whenOff && route !== 'drop' && !RX_FLEETING.test(text) ? parseWhen(text) : null;
  state.whenOff = false;
  drawWhen();
  if (when) text = when.text;
  text = expandInlineSteps(text);
  const actionTag = tags.some(t => t === 'task' || t === 'fup');
  const auto = route === 'auto' && !!state.sample && !actionTag && !when;
  let bucket = route === 'today' ? 'make' : (BUCKETS.includes(route) ? route : 'stock');
  if (when || (route === 'auto' && actionTag)) bucket = 'make';
  if (route === 'auto' && !auto && !actionTag && !when) { const r = ruleSort(text, tags); bucket = r.bucket; tags = r.tags; toast(`Sorted to ${LABEL[bucket]}`); }
  const proj = projById(pj.proj);
  const now = Date.now();
  const data = {
    text, tags, bucket,
    today: when ? when.date : route === 'today' ? TODAY : null,
    repeat: when ? when.repeat : null,
    done: false, doneAt: null,
    createdAt: now, updatedAt: now,
    source: 'typed', photo: null, page: null,
    pending: auto, cat: proj ? proj.cat : guessCat(text), proj: proj ? proj.id : null,
  };
  const id = store.newId();
  const target = store;
  try { await target.set(id, data); }
  catch (e) { els.input.value = raw; onWriteError(e); return; }
  if (when) toast(`Planned ${whenLabel(when.date)}${when.repeat ? ' ↻ ' + repeatLabel(when.repeat) : ''}${proj ? ' · #' + proj.name : ''}`);
  else if (proj && !auto) toast(`Added to #${proj.name}`);
  const isToday = !!data.today && data.today <= TODAY;
  if (!auto && innerWidth < 720) setTab(isToday ? 'today' : bucket);
  if (auto) autoSort(id, text, tags, target);
}

async function autoSort(id, text, tags, target) {
  const legend = state.symbols.map(s => `"${s.id}" = ${s.name}`).join(', ');
  const prompt = `Sort one note from a notebook app.
Buckets: "drop" = fleeting or finished, not useful after today; "stock" = worth keeping (a fact, insight, idea or reference); "make" = something to act on (a task or a thing to create).
Categories: "work" = research, study, lab or job; "personal" = life admin, family, friends, health, money, errands, home; "fun" = hobbies, games, entertainment, trips.

Note:
"""${text.slice(0, 4000)}"""

Reply with only JSON: {"bucket": "drop" | "stock" | "make", "tags": [], "category": "work" | "personal" | "fun"}`;
  let bucket = null, newTags = tags, err = null, cat = null;
  try {
    if (!state.sample) throw { code: 'no_key' };
    const r = await state.sample.json(prompt, { modelTier: 'quick' });
    bucket = r && BUCKETS.includes(r.bucket) ? r.bucket : 'stock';
    setAiStatus(null);
    const extra = r && Array.isArray(r.tags) ? r.tags.map(String).filter(t => symById(t)) : [];

  const it = byId(id);
  if (!it || !it.pending || target !== store) return;
  const byAi = !!bucket;
  if (!byAi) { const r = ruleSort(text, tags); bucket = r.bucket; newTags = r.tags; }
  try {
    await target.update(id, { bucket, tags: newTags, pending: false, ...(cat && !(byId(id) || {}).proj ? { cat } : {}), updatedAt: Date.now() });
  } catch (e) { return; }
  if (byAi) toast(`Sorted to ${LABEL[bucket]}`);
  else {
    setAiStatus(sampleMsg(err));
    toast(`Sorted on the phone to ${LABEL[bucket]}. ${providerName(state.api && state.api.provider)} unavailable: ${sampleMsg(err)}`);
  }
  if (innerWidth < 720) setTab(bucket);
}

async function downscale(file, max, quality) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  const w = src.width, hh = src.height;
  if (!w || !hh) throw new Error('empty');
  const k = Math.min(1, max / Math.max(w, hh));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(hh * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('encode'))), 'image/jpeg', quality));
}

function ocrPrompt() {
  const wd = new Date().toLocaleDateString('en-AU', { weekday: 'long' });
  const legend = state.symbols.map(s => `   - id "${s.id}": ${s.mark}${s.draw ? ` (${s.draw})` : ''} = ${s.name}`).join('\n');
  return `You are Brain Camera, the reading-and-sorting step of Kura, a notebook app that links paper notes to a digital task list.
The image is a phone photo of one page (or a two-page spread) of the user's handwritten notebook. Today is ${wd} ${TODAY}.

1. Read all the handwriting. Ignore ruled lines, dot grids, page numbers, printed notebook branding and anything outside the page.
2. Split the page into separate notes: one idea, fact or task per note. Bullet points and numbered lines are usually separate notes. Keep a heading only as part of the note it belongs to.
3. Keep the writer's own words and language. Only fix obvious misreadings. Write [?] for a word you cannot read. Do not copy the symbols themselves into the text. Add no commentary.
4. The writer marks lines with their own hand-drawn symbols, like a bullet journal:
${legend}
   Put the ids of the symbols drawn next to each note in "tags". If no symbol is drawn but the note clearly is one of these (for example an open question or a to-do), you may add that id. Otherwise leave "tags" empty.
5. Put each note in one bucket:
   "drop" = fleeting or already handled: crossed-out or ticked-off lines, scratch maths, reminders that only matter for a moment.
   "stock" = worth keeping: facts, insights, ideas, references, open questions, names, numbers to remember.
   "make" = something to act on: tasks, to-dos, follow-ups, things to write, build, send, buy or decide.
6. Set "today": true only for a "make" note the writer clearly marked for today (the word "today", today's date, or a mark they use for today). Otherwise false.
7. Pick one "category" for the whole page: "work" (research, study, lab, job), "personal" (life admin, family, health, money, errands) or "fun" (hobbies, games, entertainment, trips).

Reply with only this JSON:
{"title": "a 2-6 word title for the page", "category": "work", "items": [{"text": "...", "bucket": "stock", "tags": [], "today": false}]}
If the photo has no readable handwriting, reply {"title": "", "items": []}.`;
}

async function startScan(file) {
  if (!state.sample || !state.canImages) { openPaste(); return; }
  const scan = { status: 'preparing', blob: null, url: null, items: [], title: '', found: 0, error: '', ctl: null,
    keepPhoto: !!store.putPhoto };
  state.scan = scan;
  state.sheet = { kind: 'scan' };
  drawScan();
  try { scan.blob = await downscale(file, 1600, 0.85); }
  catch (e) {
    scan.status = 'error';
    scan.error = "This photo couldn't be opened. Try a JPEG or PNG. On a Samsung camera, turn off High efficiency pictures in camera settings.";
    drawScan();
    return;
  }
  if (state.scan !== scan) return;
  scan.url = URL.createObjectURL(scan.blob);

async function readScan(scan) {
  scan.status = 'reading';
  scan.found = 0;
  scan.error = '';
  scan.ctl = new AbortController();
  drawScan();
  try {
    const res = await state.sample.json(ocrPrompt(), {
      images: [scan.blob],
      signal: scan.ctl.signal,
      onText: ({ text }) => {
        const n = (text.match(/"text"\s*:/g) || []).length;
        if (n !== scan.found && state.scan === scan) {
          scan.found = n;
          const el = $('#scan-status');
          if (el) el.textContent = `Reading your handwriting… ${n} note${n === 1 ? '' : 's'} so far`;
        }
      },
    });
    if (state.scan !== scan) return;
    const raw = res && Array.isArray(res.items) ? res.items : [];
    scan.title = String((res && res.title) || '').trim().slice(0, 80);
    scan.items = raw.map(r => {
      const bucket = r && BUCKETS.includes(r.bucket) ? r.bucket : 'stock';
      const tags = r && Array.isArray(r.tags) ? [...new Set(r.tags.map(String).filter(t => symById(t)))] : [];
      return { text: String((r && r.text) || '').trim(), bucket, tags, today: !!(r && r.today) && bucket === 'make', keep: true };
    }).filter(r => r.text);
    scan.cat = res && CATS.includes(res.category) ? res.category : guessCat(scan.items.map(r => r.text).join(' '));
    scan.status = 'review';
    setAiStatus(null);
  } catch (e) {
    if (state.scan !== scan) return;
    if (e && e.code === 'cancelled') { closeSheet(); return; }
    scan.status = 'error';
    scan.error = sampleMsg(e);
    if (e && e.code !== 'cancelled') setAiStatus(sampleMsg(e));
    disableClaude(e);
  }
  drawScan();
}

async function commitScan(btn) {
  const scan = state.scan;
  if (!scan || scan.status === 'saving') return;
  const chosen = scan.items.filter(r => r.keep && r.text.trim());
  if (!chosen.length) { closeSheet(); return; }
  scan.status = 'saving';
  btn.textContent = 'Saving…';
  btn.disabled = true;
  let photo = null;
  if (scan.keepPhoto && store.putPhoto) {
    try { photo = await store.putPhoto(scan.blob); }
    catch (e) { toast("Couldn't keep the photo. Saving the notes without it."); }
  }
  const now = Date.now();
  const page = scan.title.trim().slice(0, 80) || null;
  let saved = 0;
  const savedIds = [];
  const sendObs = !!state.obs && scan.sendObs !== false;
  for (let i = 0; i < chosen.length; i++) {
    const r = chosen[i];
    const id = store.newId();
    const tp = takeProject(r.text.trim());
    const w = r.bucket === 'make' ? parseWhen(tp.text) : null;
    try {
      await store.set(id, {
        text: (w && w.text) || tp.text, tags: r.tags, bucket: r.bucket, today: r.today ? TODAY : (w ? w.date : null), repeat: w ? w.repeat : null,
        done: false, doneAt: null, createdAt: now - i, updatedAt: now,
        source: 'scan', photo, page, pending: false, cat: scan.cat || guessCat(r.text), proj: tp.proj || scan.proj || null,
      });
      saved++;
      savedIds.push(id);
    } catch (e) { onWriteError(e); break; }
  }
  closeSheet();
  if (saved) toast(`Added ${saved} note${saved === 1 ? '' : 's'} from your page`);
  if (saved && sendObs) setTimeout(() => sendToObsidian(savedIds.map(byId).filter(it => it && (state.obs.includeDrop || it.bucket !== 'drop')), true), 200);
}

// tiny, safe Markdown renderer: headings, bullets, **bold**, `code`, paragraphs
function mdInline(text) {
  const out = [];
  String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).forEach(part => {
    if (!part) return;
    if (/^\*\*[^*]+\*\*$/.test(part)) out.push(h('strong', { text: part.slice(2, -2) }));
    else if (/^`[^`]+`$/.test(part)) out.push(h('code', { text: part.slice(1, -1) }));
    else out.push(document.createTextNode(part));
  });
  return out;
}
function mdNodes(md) {
  const box = h('div', { class: 'nb-md' });
  let list = null, para = [];
  const flush = () => { if (para.length) { box.append(h('p', {}, mdInline(para.join(' ')))); para = []; } };
  for (const raw of String(md || '').split('\n')) {
    const line = raw.trimEnd();
    const bullet = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);
    const headm = /^#{1,6}\s+(.*)$/.exec(line);
    if (bullet) { flush(); if (!list) { list = h('ul'); box.append(list); } list.append(h('li', {}, mdInline(bullet[1]))); continue; }
    list = null;
    if (headm) { flush(); box.append(h('h4', {}, mdInline(headm[1]))); continue; }
    if (!line.trim()) { flush(); continue; }
    para.push(line.trim());
  }
  flush();
  return box;
}

function comprehendPrompt(raw, tpl) {
  const field = state.field ? `The writer's field: ${state.field}.` : 'The writer works in engineering and science.';
  return `You are the note-taking assistant inside Kura, a researcher's notebook app. ${field} Today is ${TODAY}.
Turn the rough notebook entry below into a clean note.
${tplPrompt(tpl)}
Rules:
- Keep the writer's meaning, facts and numbers exactly. Never invent results, measurements, citations, names or conclusions.
- Fix spelling, expand obvious shorthand, and use correct technical terms and SI units. If something is unclear, keep it as written and add a question about it.
- "context": up to 5 technical or scientific terms, equations or units the entry touches on, each with a short explanation from well-established textbook knowledge only. Give each "term" its standard name, with a common abbreviation in brackets if there is one, e.g. "Electrochemical impedance spectroscopy (EIS)". No citations, no speculation, nothing about the writer's own results. Use [] if the entry has nothing technical.
- "category": "work" for research, study, lab or job; "personal" for life admin, family, friends, health, money, errands or home; "fun" for hobbies, games, entertainment, trips or things done for enjoyment.${projRule()}
- "tasks": things the writer needs to do, as short imperative lines. Lines marked with a box, [] or -> are tasks.
- "questions": open questions the writer raised or left unresolved. Lines marked with ? are questions.
- "tags": 1 to 5 short lowercase topic tags, hyphenated.
- "note": the full cleaned-up entry in Markdown (short paragraphs and "- " bullets), with the same content as the original.

Reply with only this JSON:
{"title": "...", "summary": "1-2 sentences", "points": ["..."], "note": "...", "context": [{"term": "...", "explain": "..."}], "tasks": ["..."], "questions": ["..."], "tags": ["..."], "category": "work", "project": ""}

Entry:
"""
${String(raw).slice(0, 20000)}
"""`;
}
function cleanResult(r, raw) {
  const arr = (v, n) => (Array.isArray(v) ? v.map(x => String(x || '').trim()).filter(Boolean).slice(0, n) : []);
  const ctx = Array.isArray(r && r.context)
    ? r.context.map(c => ({ term: String((c && c.term) || '').trim().slice(0, 80), explain: String((c && c.explain) || '').trim().slice(0, 600) })).filter(c => c.term && c.explain).slice(0, 5)
    : [];
  return {
    title: String((r && r.title) || '').trim().slice(0, 120) || String(raw).trim().split('\n')[0].slice(0, 80) || 'Untitled note',
    summary: String((r && r.summary) || '').trim().slice(0, 600),
    points: arr(r && r.points, 12),
    note: String((r && r.note) || '').trim() || String(raw).trim(),
    context: ctx,
    tasks: arr(r && r.tasks, 20).map(t => ({ text: t, keep: true, today: false })),
    questions: arr(r && r.questions, 20).map(t => ({ text: t, keep: true })),
    tags: arr(r && r.tags, 5).map(t => t.toLowerCase().replace(/\s+/g, '-').replace(/[^\p{L}\p{N}_\-/]/gu, '')).filter(Boolean),
    proj: ((r && r.project && projByTag(String(r.project))) || {}).id || takeProject(raw).proj || null,
    cat: CATS.includes(r && r.category) ? r.category : guessCat(raw),
    ai: true,
  };
}
function offlineResult(raw, title, tpl) {
  const lines = splitPasted(raw).filter(l => !/^#{1,6}\s/.test(l.text) && l.text !== '—');
  const tasks = lines.filter(l => l.bucket === 'make').map(l => ({ text: l.text, keep: true, today: false }));
  const questions = lines.filter(l => l.bucket !== 'make' && l.tags.includes('unr')).map(l => ({ text: l.text, keep: true }));
  const first = (String(raw).split('\n').map(x => x.trim()).find(x => x && !/^#{1,6}\s/.test(x)) || '').replace(/^[!?\s]+/, '').slice(0, 80)
    || (tpl && tpl !== 'blank' ? tplById(tpl).name + ' · ' + shortDay(TODAY) : '');
  return { title: (title || '').trim() || first || 'Untitled note', summary: '', points: [], note: String(raw).trim(), context: [], tasks, questions, tags: [], cat: guessCat(raw), proj: takeProject(raw).proj || null, ai: false };
}

async function nbComprehend() {
  const nb = state.nb, d = nb && nb.draft;
  if (!d || !d.raw.trim()) { toast('Write something first.'); return; }
  if (!state.sample) {
    d.result = offlineResult(d.raw, d.title, d.tpl);
    drawNotebook();
    toast('No AI key: kept as written, with tasks and questions found by rules.');
    return;
  }
  nb.busy = 'Reading your note…';
  nb.ctl = new AbortController();
  drawNotebook();
  try {
    const r = await state.sample.json(comprehendPrompt(d.raw, d.tpl), { signal: nb.ctl.signal });
    if (state.nb !== nb) return;
    d.result = cleanResult(r, d.raw);
    if (d.title.trim()) d.result.title = d.title.trim();
    setAiStatus(null);
  } catch (e) {
    if (state.nb !== nb) return;
    if (e && e.code === 'cancelled') { nb.busy = ''; drawNotebook(); return; }
    setAiStatus(sampleMsg(e));
    d.result = offlineResult(d.raw, d.title, d.tpl);
    toast('AI unavailable, so the note was kept as written: ' + sampleMsg(e));
  }
  nb.busy = '';
  drawNotebook();
}

async function nbTranscribe(file) {

function noteMarkdown(n) {
  const lines = ['---', `created: ${dayStr(new Date(n.created || Date.now()))}`, (isNlmNote(n) ? 'source: notebooklm' : 'source: kura'), ...(isNlmNote(n) && n.src.notebook ? [`notebooklm_notebook: "${n.src.notebook.replace(/"/g, '')}"`] : []), `category: ${CAT_NAME[catOf(n)]}`, ...(projOf(n) ? [`project: ${projOf(n).name}`] : []), ...(n.tpl && n.tpl !== 'blank' ? [`type: ${n.tpl}`] : []), `tags: [${['kura/note', 'kura/' + catOf(n), ...(projOf(n) ? ['project/' + projSlug(projOf(n).name)] : []), ...(n.tpl && n.tpl !== 'blank' ? ['kura/' + n.tpl] : []), ...(n.tags || [])].join(', ')}]`, '---', '', `# ${n.title}`, ''];
  if (isNlmNote(n) && n.src.question) lines.push(`**Asked in NotebookLM:** ${n.src.question}`, '');
  if (n.summary) lines.push(`> ${n.summary}`, '');
  if ((n.points || []).length) lines.push('## Key points', ...n.points.map(p => `- ${p}`), '');
  lines.push('## Notes', n.note || n.raw || '', '');
  if ((n.context || []).length) lines.push('## Technical context', '_Added by AI from general knowledge. Check before relying on it._', ...n.context.map(c => { const g = findTerm(parseTerm(c.term)); const gp = (state.obs && state.obs.glossaryNote) || DEFAULT_OBS.glossaryNote; return g ? `- **[[${gp}#${mdSafe(g.term)}|${mdSafe(c.term)}]]**: ${c.explain}` : `- **${c.term}**: ${c.explain}`; }), '');
  if ((n.tasks || []).length) lines.push('## Tasks', ...n.tasks.map(t => `- [ ] ${t} #kura/make`), '');
  if ((n.questions || []).length) lines.push('## Open questions', ...n.questions.map(q => `- ${q}`), '');
  if (n.raw && n.raw.trim() !== (n.note || '').trim()) lines.push('## Original', '```', n.raw.trim(), '```', '');
  return lines.join('\n');
}
function noteFilePath(n, cfg) {
  const folder = (cfg.notesFolder || DEFAULT_OBS.notesFolder).replace(/^\/+|\/+$/g, '');
  const name = `${dayStr(new Date(n.created || Date.now()))} ${n.title}`.replace(/[\\/:*?"<>|#^[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100);
  return folder + '/' + CAT_NAME[catOf(n)] + '/' + name;
}
function sendNoteToObsidian(n) {
  const cfg = state.obs;
  if (!cfg || !cfg.vault) { toast('Connect your Obsidian vault in Settings first.'); openSettings('obsidian'); return; }
  const enc = encodeURIComponent;
  const path = noteFilePath(n, cfg);
  const uri = `obsidian://new?vault=${enc(cfg.vault)}&file=${enc(path)}&content=${enc(noteMarkdown(n))}&overwrite=true&silent=true`;
  launchObsidian(uri, async () => {
    const old = n.obsPath;
    n.sentAt = Date.now();
    n.obsPath = path;
    await store.putNote(n).catch(() => {});
    toast(old && old !== path ? `Note sent to ${CAT_NAME[catOf(n)]}. Delete the old copy (${old}) in Obsidian.` : 'Note sent to Obsidian');
    drawNotebook();
  });
}

async function nbSave(sendObs) {
  const nb = state.nb, d = nb && nb.draft;
  if (!d) return;
  if (!d.result) d.result = offlineResult(d.raw, d.title, d.tpl);
  const r = d.result;
  const now = Date.now();
  const prev = d.id ? noteById(d.id) : null;
  const n = {
    id: d.id || newNoteId(), created: prev ? prev.created : now, updated: now,
    title: (d.title.trim() || r.title).slice(0, 120), raw: d.raw, summary: r.summary, points: r.points, note: r.note,
    context: r.context, tags: r.tags, ai: r.ai, cat: CATS.includes(d.cat) ? d.cat : (r.cat || guessCat(d.raw)),
    tpl: d.tpl || (prev && prev.tpl) || 'blank', proj: d.proj !== undefined ? (d.proj || null) : (r.proj || null), obsPath: prev ? prev.obsPath || null : null,
    tasks: r.tasks.filter(t => t.keep).map(t => t.text), questions: r.questions.filter(q => q.keep).map(q => q.text),
    itemIds: prev ? (prev.itemIds || []).slice() : [], sentAt: prev ? prev.sentAt : null, src: prev ? prev.src || null : null,
  };
  // tasks → MAKE (or TODAY), questions → STOCK with ? Unresolved; skip ones this note already created
  const existing = new Set(state.items.filter(it => it.noteId === n.id).map(it => String(it.text).trim().toLowerCase()));
  let made = 0;
  for (const t of r.tasks.filter(x => x.keep && !existing.has(x.text.trim().toLowerCase()))) {
    const id = store.newId();
    const w = parseWhen(t.text);
    await store.set(id, { text: (w && w.text) || t.text, tags: symById('task') ? ['task'] : [], bucket: 'make', today: t.today ? TODAY : (w ? w.date : null), repeat: w ? w.repeat : null, done: false, doneAt: null,
      createdAt: now - made, updatedAt: now, source: 'note', photo: null, page: n.title, pending: false, noteId: n.id, cat: n.cat, proj: n.proj }).catch(onWriteError);
    n.itemIds.push(id);
    made++;
  }
  for (const q of r.questions.filter(x => x.keep && !existing.has(x.text.trim().toLowerCase()))) {
    const id = store.newId();
    await store.set(id, { text: q.text, tags: symById('unr') ? ['unr'] : [], bucket: 'stock', today: null, done: false, doneAt: null,
      createdAt: now - made, updatedAt: now, source: 'note', photo: null, page: n.title, pending: false, noteId: n.id, cat: n.cat, proj: n.proj }).catch(onWriteError);
    n.itemIds.push(id);
    made++;
  }
  await store.putNote(n).catch(onWriteError);
  state.notes = (state.notes || []).filter(x => x.id !== n.id).concat(n);
  if (prev && prev.cat !== n.cat) for (const it of state.items.filter(i => i.noteId === n.id && i.cat !== n.cat)) await patch(it.id, { cat: n.cat });
  if (prev && (prev.proj || null) !== n.proj) for (const it of state.items.filter(i => i.noteId === n.id && (i.proj || null) !== n.proj)) await patch(it.id, { proj: n.proj });
  const newTerms = await syncGlossary(n);
  if (nb.cat && nb.cat !== 'all' && nb.cat !== n.cat) nb.cat = nbPrefs.cat = n.cat;
  nb.sel = n.id;
  nb.mode = 'view';
  nb.draft = null;
  drawNotebook();
  toast(['Note saved to ' + CAT_NAME[n.cat], made ? `${made} task${made === 1 ? '' : 's'}/question${made === 1 ? '' : 's'} added` : '', newTerms ? `${newTerms} new glossary term${newTerms === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · '));
  if (sendObs && state.obs) setTimeout(() => sendNoteToObsidian(n), 150);
  checkTrophies();
}

async function nbAsk(question) {
  const nb = state.nb;
  const q = String(question || '').trim();
  if (!q || !nb) return;
  const qw = nbWords(q).filter(w => !NB_STOP.has(w));
  const cat = nb.cat || 'all';
  const inCat = x => cat === 'all' || catOf(x) === cat;
  const docs = [
    ...(state.notes || []).filter(inCat).map(n => ({ ref: n.id, kind: 'note', title: n.title, date: dayStr(new Date(n.created || 0)),
      body: [projOf(n) ? 'Project: ' + projOf(n).name : '', n.summary, (n.points || []).join('; '), n.note || n.raw, (n.tags || []).join(' ')].filter(Boolean).join('\n') })),
    ...state.items.filter(it => !it.example && inCat(it)).map(it => ({ ref: it.id, kind: 'item', title: String(it.text).split('\n')[0].slice(0, 80), date: dayStr(new Date(it.createdAt || 0)),
      body: `${it.text}${it.page ? ' (page: ' + it.page + ')' : ''}${projOf(it) ? ' #' + projOf(it).name : ''}${it.today ? ' (planned ' + it.today + (it.repeat ? ', repeats ' + repeatLabel(it.repeat) : '') + ')' : ''} [${LABEL[it.bucket] || ''}${it.done ? ', done' : ''}]` })),
    ...(state.glossary || []).filter(g => cat === 'all' || termCats(g).includes(cat)).map(g => ({ ref: g.id, kind: 'term', title: g.term, date: dayStr(new Date(g.created || 0)), body: g.def })),
  ];
  const score = d => {
    const t = nbWords(d.title), b = nbWords(d.body);
    let sc = 0;
    for (const w of qw) sc += 3 * t.filter(x => x.startsWith(w)).length + b.filter(x => x.startsWith(w)).length;
    return sc;
  };
  let ranked = docs.map(d => ({ d, s: score(d) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.d);
  if (!ranked.length) ranked = docs.filter(d => d.kind === 'note').slice(0, 5);
  const picked = [];
  let budget = 24000;
  for (const d of ranked) {
    const len = d.body.length + d.title.length + 40;
    if (len > budget) continue;
    picked.push(d);
    budget -= len;
    if (picked.length >= 12) break;
  }
  const turn = { q, a: '', refs: picked.map(d => d.ref), busy: true };
  nb.chat.push(turn);
  drawNotebook();
  if (!state.sample) {
    turn.busy = false;
    turn.onlyRefs = true;
    turn.a = picked.length ? 'No AI key, so here are the notes that match your question best:' : 'Nothing in your notebook matches that yet.';
    drawNotebook();
    return;
  }
  const field = state.field ? `The user's field: ${state.field}.` : '';
  const history = nb.chat.slice(-4, -1).filter(t => t.a).map(t => `Q: ${t.q}\nA: ${t.a}`).join('\n\n');
  const prompt = `You answer questions about the user's own notebook (notes, quick notes and a glossary of technical terms). ${field}
Use the NOTES below as your main source. After each sentence that uses a note, cite it by its id in square brackets, like [${picked[0] ? picked[0].ref : 'id'}].
If the notes don't answer the question, say so plainly. You may then add general technical knowledge, starting that part with "General knowledge:". Never invent the user's own results, measurements or data.
Keep the answer short and practical. Plain text, no Markdown headings.
${history ? '\nEarlier in this conversation:\n' + history + '\n' : ''}
NOTES:
${picked.map(d => `[${d.ref}] ${d.title} (${d.kind === 'note' ? 'note' : d.kind === 'term' ? 'glossary term' : 'quick note'}, ${d.date})\n${d.body}`).join('\n\n') || '(no notes yet)'}

Question: ${q}`;
  try {
    const r = await state.sample(prompt, {});
    turn.a = r.text.trim();
    setAiStatus(null);
  } catch (e) {
    turn.onlyRefs = true;
    turn.a = "Couldn't ask the AI (" + sampleMsg(e) + '). Here are the notes that match best:';
  }
  turn.busy = false;
  if (state.nb === nb) drawNotebook();
}

function answerNodes(turn) {

const CATS = ['work', 'personal', 'fun'];
const CAT_NAME = { work: 'Work', personal: 'Personal', fun: 'Fun' };
const RX_CAT = {
  work: /\b(work|lab|labs|experiments?|supervisor|phd|thesis|papers?|manuscript|journal|conference|abstract|poster|grant|ethics|protocol|samples?|data|dataset|analys[ie]s|analy[sz]e|results?|figures?|slides?|meeting|seminar|lecture|tutorial|students?|research|catheters?|electrodes?|impedance|ablation|prototypes?|fabricat\w*|measure\w*|calibrat\w*|matlab|python|code|cad|solidworks|university|uni|usyd|colleagues?|report|supplier|analy[sz]er|oscilloscope|saline|nanowires?|foam|in vivo|in vitro|animals?|surgery|clinical|pcb|sensors?|signal|ecg|pacing)\b/gi,
  personal: /\b(personal|mum|mom|dad|mother|father|sister|brother|family|partner|girlfriend|boyfriend|wife|husband|birthday|gift|rent|bills?|bank|tax|insurance|superannuation|medicare|doctor|gp|dentist|physio|pharmacy|prescription|haircut|groceries|grocery|shopping|laundry|cleaning|vacuum|house|apartment|landlord|car|rego|petrol|gym|workout|sleep|meal prep|cook|dinner|lunch|breakfast|budget|savings|passport|licen[cs]e|chores?)\b/gi,
  fun: /\b(fun|games?|gaming|play|movies?|films?|anime|manga|netflix|youtube|lofi|music|songs?|album|concert|gig|festival|party|holiday|trip|travel|beach|hik(?:e|ing)|camping|pok[eé]mon|tcg|lego|hobby|drawing|painting|watercolou?r|photography|recipe|restaurant|cafe|drinks|footy|football|soccer|basketball|novel|podcast)\b/gi,
};
function guessCat(text, fallback) {
  const t = String(text || '');
  let best = null, bestN = 0;
  for (const c of CATS) {
    const n = (t.match(RX_CAT[c]) || []).length;
    if (n > bestN) { best = c; bestN = n; }
  }
  return best || (CATS.includes(fallback) ? fallback : 'work');
}
const catOf = x => (x && CATS.includes(x.cat) ? x.cat : guessCat(x ? [x.title, x.text, x.note, x.raw].filter(Boolean).join(' ') : ''));
function catSeg(value, onChange) {

  for (const c of CATS) {
    seg.append(h('button', {
      type: 'button', 'data-cat': c, 'aria-pressed': String(c === value),
      onclick: () => {
        $$('button', seg).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cat === c)));
        onChange(c);
      },
    }, CAT_NAME[c].toUpperCase()));
  }
  return seg;
}

/* ---------- glossary: technical terms collected from your notes ---------- */
let glossIgnore = [];
const newTermId = () => 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const termById = id => (state.glossary || []).find(g => g.id === id);
function normTerm(s) {
  let k = String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  if (k.length > 4 && /s$/.test(k) && !/(is|us|ss)$/.test(k)) k = k.slice(0, -1);
  return k;
}
function parseTerm(raw) {
  const s = String(raw || '').trim().replace(/\s+/g, ' ').slice(0, 80);
  const m = /^(.*?)\s*\(([^)]{1,60})\)\s*$/.exec(s);
  const main = (m ? m[1] : s).trim() || s;
  return { label: s, key: normTerm(main), alias: m ? normTerm(m[2]) : '' };
}
function findTerm(p) {
  if (!p || !p.key) return null;
  return (state.glossary || []).find(g => g.key === p.key || (g.alias && g.alias === p.key) || (p.alias && (g.key === p.alias || g.alias === p.alias))) || null;
}
async function markGloss() {

async function syncGlossary(n, removing) {
  if (!state.glossary) state.glossary = [];
  const now = Date.now();
  const touched = new Set(), used = new Set();
  let added = 0;
  if (!removing) {
    for (const c of n.context || []) {
      const p = parseTerm(c.term);
      if (!p.key || glossIgnore.includes(p.key)) continue;
      let g = findTerm(p);
      if (!g) {
        g = { id: newTermId(), term: p.label, key: p.key, alias: p.alias, def: String(c.explain || '').trim(), noteIds: [], edited: false, created: now, updated: now };
        state.glossary.push(g);
        touched.add(g);
        added++;
      } else if (!g.alias && p.alias) { g.alias = p.alias; touched.add(g); }
      used.add(g.id);
      if (!g.noteIds.includes(n.id)) { g.noteIds = [...g.noteIds, n.id]; g.updated = now; touched.add(g); }
    }
  }
  for (const g of state.glossary) {
    if (!used.has(g.id) && g.noteIds.includes(n.id)) { g.noteIds = g.noteIds.filter(x => x !== n.id); g.updated = now; touched.add(g); }
  }
  for (const g of touched) {
    if (!g.noteIds.length && !g.edited) {
      state.glossary = state.glossary.filter(x => x !== g);
      if (store.deleteTerm) await store.deleteTerm(g.id).catch(() => {});
    } else await saveTerm(g);
  }
  if (touched.size) await markGloss();
  return added;
}
async function removeTerm(g) {
  state.glossary = (state.glossary || []).filter(x => x.id !== g.id);
  if (store.deleteTerm) await store.deleteTerm(g.id).catch(onWriteError);
  if (g.key && !glossIgnore.includes(g.key)) {

}
const glossSorted = () => (state.glossary || []).slice().sort((a, b) => a.term.localeCompare(b.term, 'en', { sensitivity: 'base' }));

function glossaryMarkdown(cfg) {
  const terms = glossSorted();
  const lines = ['---', 'source: kura', 'tags: [kura/glossary]', `updated: ${TODAY}`, '---', '', '# Glossary', '',
    `_${terms.length} term${terms.length === 1 ? '' : 's'} collected by Kura from the Technical context of your notes. Definitions marked (AI) were written by AI from general knowledge; check them before relying on them._`, ''];
  let letter = '';

    const L = /^[a-z]/i.test(g.term) ? g.term[0].toUpperCase() : '#';
    if (L !== letter) { letter = L; lines.push(`## ${L === '#' ? '0–9' : L}`, ''); }
    lines.push(`### ${mdSafe(g.term)}`, g.def + (g.edited ? '' : ' _(AI)_'));
    const links = (g.noteIds || []).map(noteById).filter(Boolean)
      .map(n => (n.sentAt ? `[[${n.obsPath || noteFilePath(n, cfg)}|${mdSafe(n.title)}]]` : mdSafe(n.title)));
    if (links.length) lines.push('', 'Used in: ' + links.join(', '));
    lines.push('');
  }
  return lines.join('\n');
}
function sendGlossaryToObsidian() {
  const cfg = state.obs;
  if (!cfg || !cfg.vault) { toast('Connect your Obsidian vault in Settings first.'); openSettings('obsidian'); return; }
  if (!(state.glossary || []).length) { toast('The glossary is empty. Comprehend a technical note first.'); return; }
  const enc = encodeURIComponent;
  const uri = `obsidian://new?vault=${enc(cfg.vault)}&file=${enc(cfg.glossaryNote || DEFAULT_OBS.glossaryNote)}&content=${enc(glossaryMarkdown(cfg))}&overwrite=true&silent=true`;
  if (uri.length > 900000) { toast('The glossary is too long to send in one go. Export a backup from Settings instead.'); return; }
  launchObsidian(uri, async () => {
    state.glossSentAt = Date.now();
    if (store.kvSet) await store.kvSet('glossSentAt', state.glossSentAt).catch(() => {});
    toast('Glossary sent to Obsidian');

}

function drawWeek(items, filtering) {
  const end = addDays(TODAY, 7);
  const byDay = (a, b) => (a.today < b.today ? -1 : a.today > b.today ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  const up = items.filter(it => !it.done && it.today && it.today > TODAY && it.today <= end).sort(byDay);
  const later = items.filter(it => !it.done && it.today && it.today > end).sort(byDay);
  const nodes = [];
  let day = '';
  for (const it of up) {
    if (it.today !== day) {
      day = it.today;
      nodes.push(h('li', { class: 'wk-day', text: parseDay(day).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }) + (day === addDays(TODAY, 1) ? ' · tomorrow' : '') }));
    }
    nodes.push(laneRow(it));
  }
  if (later.length) nodes.push(h('li', { class: 'wk-day', text: `Later · ${later.length}` }), ...later.slice(0, 5).map(laneRow));
  els.todayList.replaceChildren(...nodes);
  els.todayCount.textContent = up.length ? `/ ${pad2(up.length)} planned` : '';
  els.todayEmpty.hidden = nodes.length > 0;
  els.todayEmpty.textContent = filtering ? 'No matches.' : 'Nothing planned for the next 7 days. Type a date with a task, like "Submit abstract fri" or "Lab meeting prep every mon".';
}

// date + repeat controls for the note sheet
function whenControls(it, onDone) {
  const dateIn = h('input', { class: 'field-in date-in', id: 'item-date', type: 'date', 'aria-label': 'Planned date' });
  dateIn.value = it.today || '';
  dateIn.addEventListener('change', async () => {
    const v = dateIn.value || null;
    const cur = byId(it.id);
    if (!cur) return;
    await patch(it.id, v
      ? { today: v, done: false, doneAt: null, pending: false, gtaskGone: false, bucket: cur.bucket === 'drop' ? 'make' : cur.bucket }
      : { today: null, repeat: null });
    onDone();
  });
  const base = it.today || TODAY;
  const dw = dowOfDay(base), dom = parseDay(base).getDate();
  const presets = {
    day: { unit: 'day', n: 1 }, weekday: { unit: 'weekday', n: 1 },
    week: { unit: 'week', n: 1, dows: [dw] }, week2: { unit: 'week', n: 2, dows: [dw] }, month: { unit: 'month', n: 1, dom },
  };

  const rkey = x => [x.unit, x.n || 1, (x.dows || []).join(','), x.dom || ''].join('|');
  const curKey = !r ? '' : Object.keys(presets).find(k => rkey(presets[k]) === rkey(r)) || 'custom';
  const sel = h('select', { class: 'field-in rep-sel', id: 'item-repeat', 'aria-label': 'Repeat' },
    h('option', { value: '', text: "Doesn't repeat" }),
    ...Object.keys(presets).map(k => h('option', { value: k, text: repeatLabel(presets[k]) })),
    curKey === 'custom' ? h('option', { value: 'custom', text: repeatLabel(r) }) : null);
  sel.value = curKey;
  sel.addEventListener('change', async () => {
    const k = sel.value;
    if (k === 'custom') return;
    const rule = k ? presets[k] : null;
    const cur = byId(it.id);
    if (!cur) return;
    const p = { repeat: rule, spawned: false, spawnedId: null };
    if (rule && !cur.today) Object.assign(p, { today: firstOccurrence(rule, TODAY), bucket: 'make', done: false, doneAt: null });
    await patch(it.id, p);
    onDone();
  });
  return h('div', { class: 'row' },
    h('span', { class: 'lbl', text: 'Date' }), dateIn,
    it.today ? h('button', { class: 'btn', type: 'button', 'aria-label': 'Clear date', onclick: async () => { await patch(it.id, { today: null, repeat: null }); onDone(); } }, '✕') : null,
    h('span', { class: 'lbl', text: 'Repeat' }), sel);
}

    if (rec !== r) return;

  recBtn = btn;
  btn.classList.add('rec');

const fx = { sound: false, haptics: true, volume: 0.6 };

  trophy: a => [523, 659, 784, 1047].forEach((f, i) => tone(a, f, f, 0.11, 'square', 0.07, i * 0.09)),
  swipe: a => tone(a, 320, 620, 0.07, 'sine', 0.1),

  };

    right: { hint: 'KEEP', run: () => patchWithUndo(it.id, { bucket: 'stock', pending: false }, 'Kept in STOCK') },

let doneLogT = null;
function syncDoneLog() {
  const log = state.doneLog || (state.doneLog = {});

  for (const it of state.items) {
    if (it.example) continue;
    if (it.done && it.doneAt) {
      const d = dayStr(new Date(it.doneAt));
      const arr = log[d] || (log[d] = []);
      if (!arr.includes(it.id)) { arr.push(it.id); changed = true; }
    } else open.add(it.id);
  }
  for (const d of Object.keys(log)) {
    const keep = log[d].filter(id => !open.has(id));
    if (keep.length !== log[d].length) { changed = true; if (keep.length) log[d] = keep; else delete log[d]; }
  }
  if (changed) {
    clearTimeout(doneLogT);
    doneLogT = setTimeout(() => { if (store.kvSet) store.kvSet('doneLog', state.doneLog).catch(() => {}); drawStreak(); checkTrophies(); }, 400);

}

function pdfMarkdown(doc, md, base = {}) {
  let para = [];
  const flush = () => { if (para.length) { doc.text(para.join(' '), { ...base, after: 4 }); para = []; } };
  for (const raw of String(md || '').split('\n')) {
    const line = raw.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').trimEnd();
    const hd = /^#{1,6}\s+(.*)$/.exec(line);
    const step = /^\s*(?:[-*•]\s*)?\[( |x|X)?\]\s*(.+)$/.exec(line);
    const bl = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);
    if (hd) { flush(); doc.text(hd[1], { font: 'B', size: 10.5, before: 4, after: 1, keep: 30 }); continue; }
    if (step) { flush(); doc.text(step[2], { ...base, bullet: step[1] && step[1].trim() ? '[x]' : '[ ]', hang: 18, indent: 4 }); continue; }
    if (bl) { flush(); doc.text(bl[1], { ...base, bullet: '•', hang: 12, indent: 4 }); continue; }
    if (!line.trim()) { flush(); continue; }
    para.push(line.trim());
  }
  flush();
}

const guideStrip = t => String(t || '').replace(/\*\*/g, '').replace(/`/g, '');

    if (b.h) parts.push(b.h);
    if (b.note) parts.push(b.note);
    if (b.steps) parts.push(...b.steps);
    if (b.list) parts.push(...b.list);
    if (b.table) parts.push(...b.table.flat());
    if (b.try) parts.push(...b.try.map(t => t[0]));

}

    if (b.steps) return h('ol', {}, b.steps.map(x => h('li', {}, mdInline(x))));
